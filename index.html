<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Saud — Business Tracking Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Design tokens. Colors are driven by state.theme via applyTheme()
     (accent / bg / text); everything else is derived from those three,
     so swapping in Midwam's official palette is a one-line change in
     MIDWAM_DEFAULT_THEME.
     ============================================================ */
  :root{
    --night:   #0E0E11;   /* page background */
    --night2:  #17171B;   /* cards / surfaces */
    --night3:  #1E1E23;   /* raised / hover */
    --sidebar: #121215;
    --copper:  #F26522;   /* brand accent */
    --accent2: #F69F33;   /* secondary accent (gradients) */
    --accent-soft: rgba(242,101,34,.14);
    --cream:   #F4F1EC;   /* main text */
    --sand:    #D9D3CB;   /* secondary text / headings */
    --muted:   #8E8A85;   /* labels */
    --border:  rgba(255,255,255,0.07);
    --dark:    #0E0E11;
    --card:    #17171B;
    --good:      #22b573;
    --warning:   #e8a33d;
    --serious:   #ec835a;
    --critical:  #e5484d;
    --series-blue:   #4c8dff;
    --series-orange: #F26522;
    --series-aqua:   #2bb5a0;
    --muted-bar: #34343b;
    --radius: 16px;
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.25);
    --font-display: "Rajdhani", "Inter", system-ui, sans-serif;
    --font-body: "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; font-family:var(--font-body); font-size:14px; line-height:1.5;
    background:var(--night); color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--copper); color:#fff;}
  [dir="rtl"], :lang(ar){font-family:"IBM Plex Sans Arabic", var(--font-body);}

  /* ---------- app shell: sidebar + main ---------- */
  .app{display:grid; grid-template-columns:256px minmax(0,1fr); min-height:100vh;}
  .sidebar{
    position:sticky; top:0; height:100vh; overflow-y:auto;
    background:var(--sidebar); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:22px 14px 18px;
  }
  .sb-brand{padding:4px 10px 22px; border-bottom:1px solid var(--border); margin-bottom:14px;}
  .sb-logo{display:flex; align-items:center; gap:10px; min-height:34px;}
  .sb-logo img{max-height:34px; max-width:180px; display:block;}
  .sb-logo-mark{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:radial-gradient(circle at 35% 35%, var(--accent2), var(--copper) 60%, transparent 61%),
               conic-gradient(from 200deg, var(--copper), transparent 70%);
    box-shadow:0 0 18px var(--accent-soft);
  }
  .sb-logo-text{font-family:var(--font-display); font-weight:700; font-size:22px; letter-spacing:.14em; color:var(--copper); line-height:1;}
  .brand{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-top:10px;}
  .nav-label{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 12px 8px;}
  .tabs-nav{display:flex; flex-direction:column; gap:2px;}
  .tab-btn{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:none; border:none; color:var(--sand); font-family:var(--font-body); font-size:13.5px; font-weight:500;
    padding:10px 12px; border-radius:10px; cursor:pointer; position:relative; transition:background .15s, color .15s;
  }
  .tab-btn svg{width:18px; height:18px; flex-shrink:0; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; opacity:.75;}
  .tab-btn:hover{background:var(--night3); color:var(--cream);}
  .tab-btn.active{background:var(--accent-soft); color:var(--cream); font-weight:600;}
  .tab-btn.active svg{stroke:var(--copper); opacity:1;}
  .tab-btn.active::before{content:""; position:absolute; left:-14px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--copper);}
  .sb-foot{margin-top:auto; padding:16px 10px 0; border-top:1px solid var(--border); font-size:11.5px; color:var(--muted); display:flex; flex-direction:column; gap:4px;}
  .sb-foot .lastup-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  #lastUpdatedText{color:var(--sand); font-weight:600;}

  .main{min-width:0; padding:26px 40px 90px; max-width:1400px; width:100%;}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:26px;}
  .topbar h1{margin:0; font-family:var(--font-display); font-size:32px; font-weight:700; letter-spacing:.02em; color:var(--cream); line-height:1.1; text-transform:uppercase;}
  .topbar p{margin:6px 0 0; color:var(--muted); font-size:13.5px; max-width:640px;}
  .topbar-actions{display:flex; flex-direction:column; align-items:flex-end; gap:12px;}
  [data-bind][contenteditable="true"]{outline:1px dashed var(--copper); outline-offset:2px; border-radius:4px;}
  .meta span{display:block;}
  .tinybtn{background:none; border:1px solid var(--border); color:var(--muted); font-size:10px; padding:2px 7px; border-radius:6px; cursor:pointer; font-family:inherit;}
  .tinybtn:hover{color:var(--cream); border-color:var(--copper);}

  .page-head{display:flex; align-items:center; gap:12px; margin:0 0 18px;}
  .page-title{margin:0; font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cream);}
  .page-head::before{content:""; width:28px; height:3px; border-radius:3px; background:linear-gradient(90deg, var(--copper), var(--accent2));}

  /* ---------- buttons ---------- */
  .editbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  button.editbtn{
    background:var(--copper); color:#fff; border:1px solid transparent; border-radius:10px;
    padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:var(--font-body);
    transition:filter .15s, background .15s, border-color .15s;
  }
  button.editbtn.secondary{background:var(--night2); border-color:var(--border); color:var(--sand);}
  button.editbtn.secondary:hover:not(:disabled){border-color:var(--copper); color:var(--cream);}
  button.editbtn:disabled{opacity:.45; cursor:default;}
  button.editbtn:not(.secondary):hover:not(:disabled){filter:brightness(1.08);}
  .autosave-indicator{font-size:11px; color:var(--muted); display:none; align-items:center; gap:4px;}
  .autosave-indicator.show{display:flex;}

  /* read-only viewer build: hide every editing/sync control, no exceptions */
  body.readonly #toggleEdit, body.readonly #undoBtn, body.readonly #saveBtn,
  body.readonly #toggleSync, body.readonly #syncPanel, body.readonly #draftBanner,
  body.readonly .autosave-indicator{ display:none !important; }

  /* ---------- panels (theme / sync) ---------- */
  .sync-panel{
    background:var(--night2); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px;
    margin-bottom:22px; display:none; font-size:13px; color:var(--sand); line-height:1.6; box-shadow:var(--shadow);
  }
  .sync-panel.open{display:block;}
  .sync-panel b{color:var(--cream);}
  .sync-panel .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center;}
  .sync-panel input{
    background:var(--night); border:1px solid var(--border); color:var(--cream); padding:9px 12px; border-radius:10px;
    font-size:13px; font-family:inherit;
  }
  .sync-panel input:focus{outline:none; border-color:var(--copper);}
  .sync-panel input.token{width:340px; max-width:100%;}
  .sync-panel input.short{width:160px;}
  .sync-panel input[type="color"]{width:38px; height:34px; padding:2px; cursor:pointer;}
  .theme-swatch{width:30px; height:30px; border-radius:50%; border:2px solid var(--border); cursor:pointer; flex-shrink:0;}
  .theme-swatch.active{border-color:var(--cream); box-shadow:0 0 0 2px var(--copper);}
  .sync-status{margin-top:10px; font-size:12px; color:var(--muted);}
  .sync-status.ok{color:var(--good);}
  .sync-status.err{color:var(--serious);}

  /* ---------- KPI tiles ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:16px; margin-bottom:22px;}
  .stat-tile{
    background:var(--night2); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow);
  }
  .stat-tile::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg, var(--copper), var(--accent2)); opacity:.9;}
  .stat-tile .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.09em; margin-bottom:10px; font-weight:600;}
  .stat-tile .icon{font-size:15px; margin-right:6px;}
  .stat-tile .value{font-family:var(--font-display); font-size:36px; font-weight:700; line-height:1; color:var(--cream); font-variant-numeric:tabular-nums;}
  .stat-tile .sub{font-size:12px; color:var(--muted); margin-top:8px;}

  /* ---------- sections as cards ---------- */
  section{
    background:var(--night2); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px 22px 22px; margin-bottom:20px; box-shadow:var(--shadow);
  }
  section .sechead{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  section h2{
    font-family:var(--font-display); font-size:17px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--cream);
    margin:0; background:none; border:none;
  }
  .sechead-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .addbtn{background:var(--accent-soft); border:1px dashed var(--copper); color:var(--cream); font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:8px; cursor:pointer; display:none; font-family:inherit;}
  .addbtn.show{display:inline-block;}
  .reorder{background:none; border:none; color:var(--muted); cursor:pointer; font-size:11px; padding:0 3px; line-height:1;}
  .reorder:hover{color:var(--copper);}
  .reorder:disabled{opacity:.25; cursor:default;}
  .dupbtn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 3px; line-height:1;}
  .dupbtn:hover{color:var(--series-blue);}
  .reordergrp{display:flex; flex-direction:column;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); align-items:center;}
  .legend .litem{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}

  .draft-banner{
    background:var(--accent-soft); border:1px solid var(--copper); border-radius:12px; padding:10px 16px;
    margin-bottom:20px; font-size:12.5px; color:var(--sand); display:none; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .draft-banner.show{display:flex;}
  .draft-banner button{background:none; border:1px solid var(--border); color:var(--sand); border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer;}
  .draft-banner button:hover{border-color:var(--copper); color:var(--cream);}
  .row-search{
    background:var(--night); border:1px solid var(--border); color:var(--cream); border-radius:10px;
    padding:8px 12px; font-size:12.5px; width:260px; max-width:100%; margin-bottom:12px; font-family:inherit;
  }
  .row-search:focus{outline:none; border-color:var(--copper);}

  .global-search-wrap{position:relative;}
  .global-search-wrap .row-search{width:300px; margin-bottom:0; background:var(--night2);}
  .global-search-results{
    display:none; position:absolute; top:calc(100% + 6px); right:0; width:340px; max-height:380px;
    overflow-y:auto; background:var(--night2); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 16px 40px rgba(0,0,0,.45); z-index:60;
  }
  .global-search-results.show{display:block;}
  .gsr-item{padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;}
  .gsr-item:last-child{border-bottom:none;}
  .gsr-item:hover{background:var(--night3);}
  .gsr-sec{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--copper); margin-bottom:2px; font-weight:700;}
  .gsr-title{font-size:13px; color:var(--cream);}
  .gsr-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .gsr-empty{padding:14px; font-size:12px; color:var(--muted); text-align:center;}
  [data-bind].flash-highlight{ animation: flashHighlight 1.6s ease; }
  @keyframes flashHighlight{ 0%{ background:var(--accent-soft); } 100%{ background:transparent; } }
  section.collapsed > *:not(.sechead){display:none;}
  section.collapsed .sechead{margin-bottom:0;}
  .sechead h2{cursor:pointer; user-select:none; display:flex; align-items:center; gap:10px;}
  .sechead h2::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--copper); transform:rotate(45deg); transition:opacity .15s;}
  section.collapsed .sechead h2::before{opacity:.35;}

  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; background:transparent;}
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--border); font-weight:600; white-space:nowrap;
    position:sticky; top:0; background:var(--night2); z-index:1;
  }
  thead th.actions{width:90px;}
  tbody td{padding:12px; font-size:13.5px; border-bottom:1px solid var(--border); color:var(--cream); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:not(.empty-row):not(.ext-detail):hover td{background:rgba(255,255,255,.025);}
  td.actions-cell{display:flex; gap:4px; align-items:center;}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700;}
  input[type="color"].tiny{width:26px; height:24px; padding:1px; border-radius:5px; border:1px solid var(--border); background:var(--night); cursor:pointer;}
  .rowdel{background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; border-radius:6px; padding:0 4px;}
  .rowdel:hover{color:var(--critical);}
  .rowdel.confirming{background:var(--critical); color:#fff; font-size:10px; padding:2px 6px;}
  .status-select{border:none; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; field-sizing:content; min-width:60px; max-width:220px;}
  .status-pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; letter-spacing:.02em;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; margin-bottom:18px;}
  .kpi-row .stat-tile{background:var(--night); box-shadow:none;}
  .kpi-row .stat-tile .value{font-size:28px;}
  .table-scroll{overflow-x:auto; border-radius:12px; border:1px solid var(--border);}
  .table-scroll thead th{background:var(--night3);}
  .wide-table td, .wide-table th{vertical-align:top; white-space:normal; max-width:300px;}
  .wide-table thead th{white-space:nowrap;}

  .prob-table{width:100%; max-width:380px; border-collapse:collapse; border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-top:4px;}
  .prob-table th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--border); background:var(--night3);}
  .prob-table td{padding:8px 12px; font-size:13px; border-bottom:1px solid var(--border);}
  .prob-table tr:last-child td{border-bottom:none;}
  .prob-table input[type=number]{width:64px; background:var(--night); border:1px solid var(--border); color:var(--cream); border-radius:6px; padding:3px 6px; font-size:12px;}
  .prob-note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.5;}

  .todo-row.done td{ opacity:.55; text-decoration:line-through; }
  input[type="checkbox"].donecheck{ width:16px; height:16px; cursor:pointer; accent-color:var(--copper); }

  .notes{background:var(--night); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-height:70px; font-size:13.5px; color:var(--sand); line-height:1.65;}
  .footer-note{font-size:12px; color:var(--muted); margin-top:10px; line-height:1.6; background:none; border:none; font-family:inherit; width:100%;}
  .empty-row td{color:var(--muted); font-style:normal; text-align:center; padding:26px 10px; font-size:12.5px;}
  .empty-row td::before{content:"○  "; color:var(--copper);}
  .phase-row{padding:14px 0; border-bottom:1px solid var(--border);}
  .phase-row:last-child{border-bottom:none;}
  .phase-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; font-size:14px; color:var(--cream); font-weight:500;}
  .phase-top .lbl{color:var(--muted); font-size:12px; font-weight:400; margin-top:2px;}
  .phase-top > div:nth-child(2){font-family:var(--font-display); font-size:20px;}
  .phase-bar{height:8px; border-radius:999px; background:var(--muted-bar); margin-top:10px; overflow:hidden;}
  .phase-bar > div{height:100%; border-radius:999px;}
  .gap-sev{display:inline-block; min-width:70px; text-align:center; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .ext-detail td{background:var(--night); font-size:12.5px; line-height:1.65; color:var(--muted); padding:14px 16px;}
  .ext-detail b{color:var(--cream); font-weight:600;}
  .ext-detail-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:6px 18px;}
  .detail-toggle{background:none; border:1px solid var(--border); color:var(--sand); font-size:11px; font-weight:600; border-radius:999px; padding:3px 10px; cursor:pointer; margin-top:8px; font-family:inherit;}
  .detail-toggle:hover{color:var(--cream); border-color:var(--copper);}
  .subhead{font-size:12.5px; color:var(--muted); margin:-6px 0 16px; line-height:1.55;}

  .chart-wrap{position:relative; min-height:60px;}
  .chart-empty{text-align:center; color:var(--muted); font-size:12.5px; padding:30px 0;}

  /* ---------- overview: section cards + insight panels ---------- */
  .overview-nav{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px;}
  .overview-nav .navcard{background:var(--night); border:1px solid var(--border); border-radius:14px; padding:16px 18px; cursor:pointer; text-align:left; width:100%; font-family:inherit; transition:border-color .15s, transform .15s;}
  .overview-nav .navcard:hover{border-color:var(--copper); transform:translateY(-1px);}
  .overview-nav .navcard .t{font-family:var(--font-display); font-size:17px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--cream); margin-bottom:4px;}
  .overview-nav .navcard .d{font-size:12.5px; color:var(--muted); line-height:1.45;}
  .overview-nav .navcard .o{font-size:11px; color:var(--copper); margin-top:10px; font-weight:600; letter-spacing:.04em;}
  .ov-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-bottom:20px;}
  .ov-grid section{margin-bottom:0;}
  .ov-bar-row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:7px 0;}
  .ov-bar-label{font-size:13px; color:var(--sand); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ov-bar-val{font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--cream); text-align:right;}
  .ov-bar-track{grid-column:1 / -1; height:6px; border-radius:999px; background:var(--muted-bar); overflow:hidden;}
  .ov-bar-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--copper), var(--accent2));}
  .ov-list-item{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .ov-list-item:last-child{border-bottom:none;}
  .ov-list-item .t{font-size:13px; color:var(--cream); line-height:1.4;}
  .ov-list-item .s{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ov-note{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .ov-big{font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1; color:var(--cream);}
  .ov-big small{font-size:18px; color:var(--muted); font-weight:600;}
  .ov-ring-row{display:flex; align-items:center; gap:18px; margin-bottom:12px;}

  .team-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px;}
  .teamcard{background:var(--night); border:1px solid var(--border); border-radius:14px; padding:18px 20px;}
  .teamcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .teamcard-name{font-family:var(--font-display); font-size:19px; font-weight:700; letter-spacing:.02em; color:var(--cream);}
  .teamcard-title{font-size:12.5px; color:var(--copper); margin-top:2px; font-weight:600;}
  .teamcard-reports{font-size:12px; color:var(--muted); margin-top:8px;}
  .teamcard-label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:14px; margin-bottom:6px; font-weight:600;}
  .teamcard-resp{font-size:13px; color:var(--sand); line-height:1.65; white-space:pre-line;}
  .teamcard-actions{display:flex; gap:4px; align-items:center; margin-top:10px;}

  .fill-note{background:var(--accent-soft);}

  .toast-container{position:fixed; bottom:90px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:9999;}
  .toast{
    background:var(--night2); border:1px solid var(--border); border-left:3px solid var(--copper); color:var(--cream); padding:10px 16px; border-radius:10px;
    font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.4); opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;
    max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .page{display:none; animation:pageIn .25s ease;}
  .page.active{display:block;}
  @keyframes pageIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  @media (max-width:1180px){
    .stat-row{grid-template-columns:repeat(3,minmax(0,1fr));}
    .ov-grid{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:900px){
    .app{display:block;}
    .sidebar{position:sticky; top:0; z-index:50; height:auto; flex-direction:row; align-items:center; gap:10px; padding:10px 12px; border-right:none; border-bottom:1px solid var(--border); overflow-x:auto;}
    .sb-brand{border:none; padding:0 8px 0 0; margin:0;}
    .sb-brand .brand, .nav-label, .sb-foot{display:none;}
    .tabs-nav{flex-direction:row; gap:4px;}
    .tab-btn{white-space:nowrap; padding:8px 10px; width:auto;}
    .tab-btn.active::before{display:none;}
    .main{padding:18px 16px 90px;}
    .topbar-actions{align-items:stretch; width:100%;}
    .global-search-wrap .row-search{width:100%;}
    .editbar{justify-content:flex-start;}
    .stat-row{grid-template-columns:repeat(2,minmax(0,1fr));}
    .ov-grid{grid-template-columns:1fr;}
    .team-grid{grid-template-columns:1fr;}
    section{padding:16px;}
  }

  /* ---------- Arabic / RTL ---------- */
  [dir="rtl"]{ --font-display:"IBM Plex Sans Arabic","Rajdhani",system-ui,sans-serif; --font-body:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif; }
  [dir="rtl"] .sidebar{border-right:none; border-left:1px solid var(--border);}
  [dir="rtl"] .tab-btn, [dir="rtl"] thead th, [dir="rtl"] .prob-table th, [dir="rtl"] .overview-nav .navcard{text-align:right;}
  [dir="rtl"] .tab-btn.active::before{left:auto; right:-14px; border-radius:3px 0 0 3px;}
  [dir="rtl"] .global-search-results{right:auto; left:0;}
  [dir="rtl"] .toast-container{right:auto; left:22px;}
  [dir="rtl"] .toast{border-left:1px solid var(--border); border-right:3px solid var(--copper);}
  [dir="rtl"] .ov-bar-val{text-align:left;}
  [dir="rtl"] .topbar h1, [dir="rtl"] section h2, [dir="rtl"] .page-title, [dir="rtl"] .stat-tile .label, [dir="rtl"] .brand,
  [dir="rtl"] .nav-label, [dir="rtl"] thead th, [dir="rtl"] .overview-nav .navcard .t, [dir="rtl"] .teamcard-label,
  [dir="rtl"] .gap-sev, [dir="rtl"] .prob-table th, [dir="rtl"] .gsr-sec, [dir="rtl"] .status-pill{letter-spacing:0; text-transform:none;}
  [dir="rtl"] .topbar h1{font-size:30px;}
  [dir="rtl"] section h2{font-size:17px;}
  [dir="rtl"] .stat-tile .value, [dir="rtl"] .ov-big, [dir="rtl"] .ov-bar-val, [dir="rtl"] .phase-top > div:nth-child(2){font-family:"Rajdhani","Inter",system-ui,sans-serif;}
  .sb-logo-text{font-family:"Rajdhani","Inter",system-ui,sans-serif;}
  [dir="rtl"] .ov-big small{font-family:var(--font-body); font-size:15px;}
  #langToggle{font-family:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif; font-weight:600;}
  @media (max-width:900px){ [dir="rtl"] .sidebar{border-left:none;} }
  /* mixed Arabic/English data: let each block pick its own direction so English punctuation stays put */
  [dir="rtl"] td, [dir="rtl"] [data-bind]:not([data-bind^="titles."]), [dir="rtl"] .ov-list-item .t, [dir="rtl"] .ov-list-item .s{unicode-bidi:plaintext; text-align:right;}
  [dir="rtl"] #saud-chat-fab{right:auto; left:20px;}
  [dir="rtl"] #saud-chat-panel{right:auto; left:20px;}

  @media print{
    .sidebar, .editbar, .sync-panel, .edit-only, .reordergrp, .rowdel, .dupbtn, .addbtn, .toast-container, .autosave-indicator,
    thead th.actions, td.actions-cell, .row-search, .draft-banner, .tabs-nav, .teamcard-actions, .global-search-wrap, #saud-chat-fab{ display:none !important; }
    .app{display:block;}
    .page{ display:block !important; }
    body{ background:#fff; color:#111; }
    section, .stat-tile, .notes, table, .prob-table{ background:#fff; border-color:#ccc; box-shadow:none; }
    section.collapsed > *:not(.sechead){ display:block !important; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo" id="brandLogo"><span class="sb-logo-mark"></span><span class="sb-logo-text">MIDWAM</span></div>
      <div class="brand" id="brandEl" data-bind="titles.brand"></div>
    </div>
    <div class="nav-label" id="navLabel">Workspace</div>
    <nav class="tabs-nav" id="tabsNav">
      <button class="tab-btn active" data-page="overview" onclick="switchPage('overview')"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-bind="titles.tabOverview"></span></button>
      <button class="tab-btn" data-page="program" onclick="switchPage('program')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span data-bind="titles.tabProgram"></span></button>
      <button class="tab-btn" data-page="external" onclick="switchPage('external')"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span data-bind="titles.tabExternal"></span></button>
      <button class="tab-btn" data-page="internal" onclick="switchPage('internal')"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-bind="titles.tabInternal"></span></button>
      <button class="tab-btn" data-page="projects" onclick="switchPage('projects')"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/></svg><span data-bind="titles.tabProjects"></span></button>
      <button class="tab-btn" data-page="marketing" onclick="switchPage('marketing')"><svg viewBox="0 0 24 24"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg><span data-bind="titles.tabMarketing"></span></button>
      <button class="tab-btn" data-page="tasks" onclick="switchPage('tasks')"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg><span data-bind="titles.tabTasks"></span></button>
      <button class="tab-btn" data-page="notes" onclick="switchPage('notes')"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span data-bind="titles.tabNotes"></span></button>
    </nav>
    <div class="sb-foot meta">
      <div class="lastup-row">
        <span><span data-bind="titles.labelLastUpdated"></span> <span id="lastUpdatedText" data-bind="lastUpdated"></span></span>
        <button class="tinybtn edit-only" id="setTodayBtn"><span data-bind="titles.btnSetToday"></span></button>
      </div>
      <span id="ownerLineEl" data-bind="titles.ownerLine"></span>
      <span class="autosave-indicator" id="autosaveIndicator">💾 <span id="autosaveTime"></span></span>
      <span class="autosave-indicator" id="trIndicator" style="display:none;">🌐 <span>Translating content…</span></span>
    </div>
  </aside>

  <main class="main">
  <header class="topbar">
    <div class="topbar-titles">
      <h1 id="h1El" data-bind="titles.h1"></h1>
      <p id="subtitleEl" data-bind="titles.subtitle"></p>
    </div>
    <div class="topbar-actions">
      <div class="global-search-wrap">
        <input type="text" id="globalSearch" class="row-search" placeholder="🔎 Search tenders, projects, tasks...">
        <div class="global-search-results" id="globalSearchResults"></div>
      </div>
      <div class="editbar">
        <button class="editbtn secondary" id="langToggle" onclick="toggleLang()">عربي</button>
        <button class="editbtn secondary" id="exportPptxBtn" onclick="exportPPTX()"><span data-bind="titles.btnExportPptx"></span></button>
        <button class="editbtn secondary" id="printBtn" onclick="window.print()"><span data-bind="titles.btnPrint"></span></button>
        <button class="editbtn secondary" id="toggleTheme"><span data-bind="titles.btnTheme"></span></button>
        <button class="editbtn secondary" id="toggleSync"><span data-bind="titles.btnGithubSync"></span></button>
        <button class="editbtn secondary edit-only" id="undoBtn" disabled><span data-bind="titles.btnUndo"></span></button>
        <button class="editbtn" id="toggleEdit"><span data-bind="titles.btnEdit"></span></button>
        <button class="editbtn" id="saveBtn" style="display:none;"><span data-bind="titles.btnSaveToGithub"></span></button>
      </div>
    </div>
  </header>

  <div class="draft-banner" id="draftBanner">
    <span data-bind="titles.draftRestoredMsg"></span>
    <span>
      <button onclick="dismissLocalDraft()" data-bind="titles.btnDismissDraft"></button>
      <button onclick="discardLocalDraft()" data-bind="titles.btnDiscardDraft"></button>
    </span>
  </div>

  <div class="sync-panel" id="themePanel">
    <b data-bind="titles.themeHeading"></b><br>
    <span data-bind="titles.themeDesc"></span>
    <div class="row" id="themePresets"></div>
    <div class="row" style="align-items:center;">
      <span style="font-size:12px; color:var(--muted);" data-bind="titles.labelAccentColor"></span>
      <input type="color" id="accentPicker" value="#C1701E">
      <span style="font-size:12px; color:var(--muted); margin-left:14px;" data-bind="titles.labelBackgroundColor"></span>
      <input type="color" id="bgPicker" value="#1F1B16">
      <span style="font-size:12px; color:var(--muted); margin-left:14px;" data-bind="titles.labelTextColor"></span>
      <input type="color" id="textPicker" value="#FBF6EA">
      <button class="editbtn secondary" onclick="resetTheme()"><span data-bind="titles.btnResetTheme"></span></button>
    </div>
  </div>

  <div class="sync-panel" id="syncPanel">
    <b data-bind="titles.githubSyncHeading"></b><br>
    <span data-bind="titles.githubSyncDesc"></span>
    <div class="row">
      <input class="token" type="password" id="ghToken" placeholder="GitHub personal access token (ghp_...)">
      <input class="short" type="text" id="ghOwner" placeholder="repo owner / org">
      <input class="short" type="text" id="ghRepo" placeholder="repo name">
      <input class="short" type="text" id="ghPath" placeholder="file path" value="saud-dashboard-data.json">
      <input class="short" type="text" id="ghBranch" placeholder="branch" value="main">
      <button class="editbtn" onclick="connectGitHub()"><span data-bind="titles.btnConnectLoad"></span></button>
      <button class="editbtn secondary" id="ghDisconnectBtn" onclick="forgetGhConfig()">Disconnect</button>
    </div>
    <div class="sync-status" id="syncStatus" data-bind="titles.syncNotConnectedMsg"></div>
  </div>


  <div class="page-head"><h2 class="page-title" id="pageTitle">Overview</h2></div>

  <!-- ============================== OVERVIEW ============================== -->
  <div class="page active" id="page-overview">
    <div class="stat-row" id="statRow"></div>
    <div class="ov-grid">
      <section>
        <div class="sechead"><h2 data-bind="titles.ovCatTitle"></h2></div>
        <div id="ovCategories"></div>
      </section>
      <section>
        <div class="sechead"><h2 data-bind="titles.ovDeadlinesTitle"></h2></div>
        <div id="ovDeadlines"></div>
      </section>
      <section>
        <div class="sechead"><h2 data-bind="titles.ovProgramTitle"></h2></div>
        <div id="ovProgram"></div>
      </section>
    </div>
    <section>
      <div class="sechead"><h2 data-bind="titles.sectionPipelineChart"></h2></div>
      <div class="chart-wrap">
        <canvas id="pipelineChart"></canvas>
        <div class="chart-empty" id="pipelineChartEmpty" style="display:none;" data-bind="titles.pipelineChartEmpty"></div>
      </div>
    </section>
    <section>
      <div class="sechead"><h2 data-bind="titles.sectionOverviewNav"></h2></div>
      <div class="overview-nav" id="overviewNav"></div>
    </section>
  </div>

  <!-- ============================== SAUD PROGRAM (restored from the previous dashboard) ============================== -->
  <div class="page" id="page-program">
    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionPhases"></h2>
        <button class="addbtn" onclick="addRow('phases', {name:'New phase', pct:0, label:'Not started', color:'muted'})"><span data-bind="titles.addBtnPhase"></span></button>
      </div>
      <div class="subhead" data-bind="titles.programOwnerLine"></div>
      <div id="phasesList"></div>
    </section>
    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionCaps"></h2>
        <button class="addbtn" onclick="addRow('capTeams', {team:'New team', role:'', num:'0', pct:0, color:'orange', caption:''})"><span data-bind="titles.addBtnCapTeam"></span></button>
      </div>
      <div class="kpi-row" id="capTeamsGrid"></div>
    </section>
    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionMatrix"></h2>
        <button class="addbtn" onclick="addRow('matrix', {cap:'New capability', owner:'', tier:'1', status:'Framework only'})"><span data-bind="titles.addBtnCapability"></span></button>
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th data-bind="titles.colCap"></th><th data-bind="titles.colOwner"></th><th data-bind="titles.colTier"></th><th data-bind="titles.colStatus"></th><th class="actions"></th></tr></thead>
          <tbody id="matrixBody"></tbody>
        </table>
      </div>
    </section>
    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionGaps"></h2>
        <button class="addbtn" onclick="addRow('gaps', {text:'New gap', sev:'warning'})"><span data-bind="titles.addBtnGap"></span></button>
      </div>
      <div id="gapsList"></div>
    </section>
    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionProgramSteps"></h2>
        <button class="addbtn" onclick="addStringRow('programSteps', 'New next step')"><span data-bind="titles.addBtnProgramStep"></span></button>
      </div>
      <ol class="steps" id="programStepsList" style="list-style:none; margin:0; padding:0;"></ol>
    </section>
  </div>

  <!-- ============================== EXTERNAL ============================== -->
  <div class="page" id="page-external">
    <section>
      <div class="sechead">
        <h2 id="secExternalTitle" data-bind="titles.sectionExternal"></h2>
        <div class="sechead-actions">
          <button class="editbtn secondary" id="exportExternalExcelBtn" onclick="exportExternalExcel()"><span data-bind="titles.btnExportExcel"></span></button>
          <button class="addbtn" onclick="addRow('external', {rn:'', name:'New tender', agency:'', fit:'Unknown', category:'Other/Uncategorized', bidDeadline:'', notes:''})"><span data-bind="titles.addBtnTender"></span></button>
        </div>
      </div>
      <div class="subhead" data-bind="titles.externalOwnerLine"></div>
      <div class="kpi-row" id="externalKpis"></div>
      <input type="text" class="row-search" id="externalSearch" placeholder="🔎 Search competition name, agency, or RN...">
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colExtRn"></th><th data-bind="titles.colExtName"></th><th data-bind="titles.colExtAgency"></th>
            <th data-bind="titles.colExtFit"></th><th data-bind="titles.colExtCategory"></th><th data-bind="titles.colExtDeadline"></th>
            <th data-bind="titles.colExtNotes"></th><th class="actions"></th>
          </tr></thead>
          <tbody id="externalBody"></tbody>
        </table>
      </div>
      <div class="footer-note" data-bind="titles.externalFooterNote"></div>
    </section>

    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionExtExcluded"></h2>
        <button class="addbtn" onclick="addRow('externalExcluded', {rn:'', name:'Excluded tender', agency:'', deadline:'', reason:''})"><span data-bind="titles.addBtnExcluded"></span></button>
      </div>
      <div class="subhead" data-bind="titles.extExcludedSub"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr><th data-bind="titles.colExtRn"></th><th data-bind="titles.colExtName"></th><th data-bind="titles.colExtAgency"></th><th data-bind="titles.colExtDeadline"></th><th data-bind="titles.colExclReason"></th><th class="actions"></th></tr></thead>
          <tbody id="externalExcludedBody"></tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionNews"></h2>
        <button class="addbtn" onclick="addRow('news', {date:'', source:'', headline:'New headline', relevance:'', link:'', notes:''})"><span data-bind="titles.addBtnNewsItem"></span></button>
      </div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colNewsDate"></th><th data-bind="titles.colNewsSource"></th><th data-bind="titles.colNewsHeadline"></th>
            <th data-bind="titles.colNewsRelevance"></th><th data-bind="titles.colNewsLink"></th><th data-bind="titles.colNewsNotes"></th>
            <th class="actions"></th>
          </tr></thead>
          <tbody id="newsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- ============================== INTERNAL PERFORMANCE ============================== -->
  <div class="page" id="page-internal">
    <section>
      <div class="sechead">
        <h2 id="secInternalTitle" data-bind="titles.sectionInternal"></h2>
        <button class="addbtn" onclick="addRow('internal', {name:'New opportunity', client:'', value:0, stage:'Not started', subDate:'', nextStep:'', owner:''})"><span data-bind="titles.addBtnOpportunity"></span></button>
      </div>
      <div class="subhead" data-bind="titles.internalOwnerLine"></div>
      <div class="kpi-row" id="internalKpis"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colIntName"></th><th data-bind="titles.colIntClient"></th><th data-bind="titles.colIntValue"></th>
            <th data-bind="titles.colIntStage"></th><th data-bind="titles.colIntSubDate"></th><th data-bind="titles.colIntNext"></th>
            <th data-bind="titles.colIntOwner"></th><th data-bind="titles.colIntWeighted"></th><th class="actions"></th>
          </tr></thead>
          <tbody id="internalBody"></tbody>
        </table>
      </div>
      <div class="footer-note" data-bind="titles.internalFooterNote"></div>
    </section>

    <section>
      <div class="sechead"><h2 data-bind="titles.sectionProbTable"></h2></div>
      <table class="prob-table" id="probTable"></table>
      <div class="prob-note" data-bind="titles.probNote"></div>
    </section>
  </div>

  <!-- ============================== PROJECTS & PROTOTYPES ============================== -->
  <div class="page" id="page-projects">
    <section>
      <div class="sechead">
        <h2 id="secProjectsTitle" data-bind="titles.sectionProjects"></h2>
        <button class="addbtn" onclick="addRow('projects', {name:'New project', status:'Not started', financially:'', operationally:'', issues:'', deadline:''})"><span data-bind="titles.addBtnProject"></span></button>
      </div>
      <div class="subhead" data-bind="titles.projectsOwnerLine"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colProjName"></th><th data-bind="titles.colProjStatus"></th><th data-bind="titles.colProjFin"></th>
            <th data-bind="titles.colProjOps"></th><th data-bind="titles.colProjIssues"></th><th data-bind="titles.colProjDeadline"></th>
            <th class="actions"></th>
          </tr></thead>
          <tbody id="projectsBody"></tbody>
        </table>
      </div>
    </section>

    <section>
      <div class="sechead">
        <h2 id="secPrototypesTitle" data-bind="titles.sectionPrototypes"></h2>
        <button class="addbtn" onclick="addRow('prototypes', {name:'New prototype', status:'In the Makers', team:'', notes:'', value:0})"><span data-bind="titles.addBtnPrototype"></span></button>
      </div>
      <div class="subhead" data-bind="titles.prototypesOwnerLine"></div>
      <div class="kpi-row" id="prototypesKpis"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colProtoName"></th><th data-bind="titles.colProtoStatus"></th><th data-bind="titles.colProtoTeam"></th>
            <th data-bind="titles.colProtoNotes"></th><th data-bind="titles.colProtoValue"></th><th class="actions"></th>
          </tr></thead>
          <tbody id="prototypesBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- ============================== MARKETING ============================== -->
  <div class="page" id="page-marketing">
    <section>
      <div class="sechead">
        <h2 id="secMarketingTitle" data-bind="titles.sectionMarketing"></h2>
        <button class="addbtn" onclick="addRow('marketing', {initiative:'New initiative', channel:'', status:'Not started', targetDate:'', notes:''})"><span data-bind="titles.addBtnMarketing"></span></button>
      </div>
      <div class="subhead" data-bind="titles.marketingOwnerLine"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colMktInitiative"></th><th data-bind="titles.colMktChannel"></th><th data-bind="titles.colMktStatus"></th>

/* ---------- content translation (data entered in one language, shown in the other) ---------- */
/* Every piece of text people type into the dashboard is shown in the reader's language.
   Translations are kept in state.i18n = { ar:{ "<original>":"<arabic>" }, en:{ "<original>":"<english>" } }
   and filled in automatically through the Saud worker (Claude), then saved with the data —
   so each new entry is translated once and everyone sees both languages. While editing,
   the original text is shown so edits always change the source, never a translation. */
const TR_SKIP_KEYS = new Set(["titles","titlesAr","legacyV1","theme","stats","stageProbs","i18n","_migratedV2","_migratedV3","_themeV4"]);
const TR_SKIP_FIELDS = new Set(["color","sev","tier","num","pct","rn","value","done","link","prob","tierColor","statusColor"]);
const AR_RE = /[؀-ۿ]/, LATIN_RE = /[A-Za-z]/;
function needsTr(s, lang){
  if(typeof s !== "string") return false;
  const t = s.trim(); if(!t || t === "—") return false;
  return lang === "ar" ? LATIN_RE.test(t) : AR_RE.test(t);
}
function tx(s){
  if(editing || typeof s !== "string" || !needsTr(s, LANG)) return s;
  const m = state && state.i18n && state.i18n[LANG];
  return (m && typeof m[s] === "string" && m[s]) ? m[s] : s;
}
function collectTranslatable(){
  const out = new Set();
  const add = v => { if(typeof v === "string" && v.trim() && v.trim() !== "—") out.add(v); };
  Object.keys(state).forEach(k=>{
    if(TR_SKIP_KEYS.has(k)) return;
    const v = state[k];
    if(typeof v === "string") add(v);
    else if(Array.isArray(v)) v.forEach(r=>{
      if(typeof r === "string") add(r);
      else if(r && typeof r === "object") Object.keys(r).forEach(f=>{ if(!TR_SKIP_FIELDS.has(f)) add(r[f]); });
    });
  });
  return [...out];
}
const TR_PROMPT = {
  ar: "Translate each value into Arabic (Modern Standard Arabic, concise professional business tone, for a Saudi experience-design company called Midwam). Write people's names in Arabic script (Firas → فراس, Sameer → سمير, Mohammed → محمد, Faisal → فيصل, Trad Nazer → طراد ناظر, Al-Harith Hindi → الحارث هندي). Midwam → مدوام, Saud → سعود, Etimad → اعتماد, RFP → طلب عروض. Keep digits as Western digits (0-9), keep dates and codes, SAR → ر.س.",
  en: "Translate each value into English (concise professional business tone). Use the official English names of Saudi government entities when known. Keep digits, dates and codes unchanged."
};
let __trBusy = false, __trTimer = null; const __trFailed = new Set();
function scheduleTranslate(){
  if(READONLY) return;
  clearTimeout(__trTimer);
  __trTimer = setTimeout(runTranslate, 1200);
}
async function trBatch(lang, items){
  const obj = {}; items.forEach((s,i)=>{ obj[String(i+1)] = s; });
  const content = "TRANSLATION TASK — ignore any dashboard context and do not answer as Saud. " + TR_PROMPT[lang] +
    " Keep the JSON keys unchanged. Reply with ONLY one JSON object, no prose, no code fences.\n" + JSON.stringify(obj);
  const res = await fetch("https://orange-queen-ead8.alhindiharith.workers.dev/", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ messages:[{ role:"user", content }], context:{} })
  });
  const data = await res.json();
  let text = (data && data.content && data.content[0] && data.content[0].text) || "";
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if(a < 0 || b < a) throw new Error("no JSON");
  const parsed = JSON.parse(text.slice(a, b+1));
  const out = {};
  items.forEach((s,i)=>{ const v = parsed[String(i+1)]; if(typeof v === "string" && v.trim()) out[s] = v.trim(); });
  return out;
}
async function runTranslate(){
  if(__trBusy || READONLY || !state || window.__trHold) return;
  const texts = collectTranslatable();
  state.i18n = state.i18n || {}; state.i18n.ar = state.i18n.ar || {}; state.i18n.en = state.i18n.en || {};
  // forget translations of text that no longer exists anywhere
  const live = new Set(texts);
  ["ar","en"].forEach(l=>Object.keys(state.i18n[l]).forEach(k=>{ if(!live.has(k)) delete state.i18n[l][k]; }));
  const jobs = [];
  ["ar","en"].forEach(lang=>{
    const todo = texts.filter(s=>needsTr(s, lang) && !state.i18n[lang][s] && !__trFailed.has(lang+"|"+s));
    let batch = [], size = 0;
    todo.forEach(s=>{
      if(batch.length && (batch.length >= 12 || size + s.length > 1400)){ jobs.push([lang, batch]); batch = []; size = 0; }
      batch.push(s); size += s.length;
    });
    if(batch.length) jobs.push([lang, batch]);
  });
  if(!jobs.length) return;
  __trBusy = true;
  const ind = document.getElementById("trIndicator");
  if(ind){ ind.style.display = "flex"; }
  let got = 0;
  try{
    for(let i=0; i<jobs.length; i+=3){
      const slice = jobs.slice(i, i+3);
      const results = await Promise.all(slice.map(([lang, items])=>trBatch(lang, items).then(r=>[lang,items,r]).catch(()=>[lang,items,null])));
      results.forEach(([lang, items, r])=>{
        if(!r){ items.forEach(s=>__trFailed.add(lang+"|"+s)); return; }
        Object.assign(state.i18n[lang], r); got += Object.keys(r).length;
        items.forEach(s=>{ if(!r[s]) __trFailed.add(lang+"|"+s); });
      });
      if(ind) ind.querySelector("span").textContent = L("Translating content…") + " " + Math.min(100, Math.round((i+3)/jobs.length*100)) + "%";
    }
  } finally {
    __trBusy = false;
    if(ind) ind.style.display = "none";
  }
  if(got){ renderAll(); }
}

/* When window.__SAUD_READONLY__ is set to true (by the auto-generated view/index.html build),
   this dashboard becomes a pure read-only snapshot: no local draft, no GitHub sync UI, no
   editing possible anywhere, and — if window.__SAUD_DATA__ is present — it loads that
   pre-baked live data instead of the placeholder DEFAULT_STATE. */
const READONLY = window.__SAUD_READONLY__ === true;
if(READONLY) document.body.classList.add("readonly");

/* ---------- undo history ---------- */
let history = [];
const HISTORY_LIMIT = 25;
function pushHistory(){
  try{
    history.push(JSON.stringify(state));
    if(history.length > HISTORY_LIMIT) history.shift();
    const btn = document.getElementById("undoBtn");
    if(btn) btn.disabled = false;
  } catch(e){}
}
function undo(){
  if(!history.length) return;
  const prev = history.pop();
  state = JSON.parse(prev);
  renderAll();
  const btn = document.getElementById("undoBtn");
  if(btn) btn.disabled = history.length === 0;
  showToast("Undone");
}

/* ---------- toasts ---------- */
function showToast(msg){
  const c = document.getElementById("toastContainer");
  if(!c) return;
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = L(msg);
  c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>t.remove(), 250);
  }, 2600);
}

/* ---------- inline click-to-confirm delete ---------- */
function confirmDelete(btn, fn){
  if(btn.dataset.confirming === "1"){
    clearTimeout(btn._confirmTimer);
    fn();
    return;
  }
  btn.dataset.confirming = "1";
  btn.dataset.origText = btn.textContent;
  btn.textContent = "Confirm?";
  btn.classList.add("confirming");
  btn._confirmTimer = setTimeout(()=>{
    btn.dataset.confirming = "";
    btn.textContent = btn.dataset.origText || "✕";
    btn.classList.remove("confirming");
  }, 2500);
}

function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
}
function lighten(hex, amt){
  const { r,g,b } = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt);
}
function darken(hex, amt){
  const { r,g,b } = hexToRgb(hex);
  return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt));
}
function relLuminance(hex){
  const { r,g,b } = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

function mixHex(a, b, t){
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A.r+(B.r-A.r)*t, A.g+(B.g-A.g)*t, A.b+(B.b-A.b)*t);
}
function hexA(hex, alpha){ const c = hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${alpha})`; }
function applyTheme(theme){
  if(!theme.text) theme.text = MIDWAM_DEFAULT_THEME.text;
  const root = document.documentElement.style;
  const light = relLuminance(theme.bg) > 0.5;
  root.setProperty("--copper", theme.accent);
  root.setProperty("--accent2", mixHex(theme.accent, "#FFC24A", 0.45));
  root.setProperty("--accent-soft", hexA(theme.accent, light ? 0.12 : 0.15));
  root.setProperty("--night", theme.bg);
  root.setProperty("--cream", theme.text);
  root.setProperty("--night2", light ? "#FFFFFF" : lighten(theme.bg, 0.045));
  root.setProperty("--night3", light ? darken(theme.bg, 0.035) : lighten(theme.bg, 0.085));
  root.setProperty("--sidebar", light ? darken(theme.bg, 0.02) : lighten(theme.bg, 0.02));
  root.setProperty("--sand", mixHex(theme.text, theme.bg, 0.18));
  root.setProperty("--muted", mixHex(theme.text, theme.bg, 0.45));
  root.setProperty("--muted-bar", mixHex(theme.text, theme.bg, light ? 0.86 : 0.84));
  root.setProperty("--border", light ? "rgba(0,0,0,0.09)" : "rgba(255,255,255,0.07)");
  root.setProperty("--shadow", light ? "0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05)" : "0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.25)");
  renderThemePanel();
  renderPipelineChart();
}

function renderThemePanel(){
  const wrap = document.getElementById("themePresets");
  if(!wrap) return;
  wrap.innerHTML = "";
  THEME_PRESETS.forEach(p=>{
    const active = state.theme.accent.toLowerCase()===p.accent.toLowerCase() && state.theme.bg.toLowerCase()===p.bg.toLowerCase();
    const sw = document.createElement("div");
    sw.className = "theme-swatch" + (active ? " active" : "");
    sw.title = p.name;
    sw.style.background = `linear-gradient(135deg, ${p.accent} 50%, ${p.bg} 50%)`;
    sw.onclick = ()=>{ pushHistory(); state.theme = { accent:p.accent, bg:p.bg, text:p.text }; applyTheme(state.theme); syncThemeInputs(); saveLocalDraft(); };
    wrap.appendChild(sw);
  });
  syncThemeInputs();
}
function syncThemeInputs(){
  const a = document.getElementById("accentPicker"), b = document.getElementById("bgPicker"), t = document.getElementById("textPicker");
  if(a) a.value = state.theme.accent;
  if(b) b.value = state.theme.bg;
  if(t) t.value = state.theme.text || "#FBF6EA";
}
function resetTheme(){
  pushHistory();
  state.theme = Object.assign({}, MIDWAM_DEFAULT_THEME);
  applyTheme(state.theme);
  saveLocalDraft();
}

/* ---------- migration from any older saved shape ---------- */
function migrateState(){
  if(!state.theme) state.theme = { accent:"#C1701E", bg:"#1F1B16", text:"#FBF6EA" };
  if(!state.theme.text) state.theme.text = "#FBF6EA";
  if(!state.titles) state.titles = {};
  Object.keys(DEFAULT_STATE.titles).forEach(k=>{
    if(typeof state.titles[k] !== "string") state.titles[k] = DEFAULT_STATE.titles[k];
  });
  const arrayFields = ["external","news","internal","stageProbs","projects","prototypes","marketing","tasks","milestones","todos","raci","team","sources","methodology"];
  arrayFields.forEach(k=>{ if(!Array.isArray(state[k])) state[k] = JSON.parse(JSON.stringify(DEFAULT_STATE[k])); });
  if(typeof state.notes !== "string") state.notes = DEFAULT_STATE.notes;

  /* one-time best-effort carry-over from the old phases/matrix/etimad dashboard shape,
     so a private data file saved under the previous version doesn't just vanish —
     only runs the first time a legacy file is loaded (no state.external yet AND old
     state.etimad present), and stashes anything it can't cleanly map into state.legacyV1
     rather than silently dropping it. */
  if(Array.isArray(state.etimad) && !state._migratedV2){
    if(!state.external || !state.external.length || state.external[0].name === DEFAULT_STATE.external[0].name){
      state.external = state.etimad.map(r=>({
        rn: r.rn||"", name: r.name||"", agency: r.agency||"",
        fit: FIT_COLOR[r.fit] ? r.fit : "Unknown",
        category: "Other/Uncategorized",
        bidDeadline: r.bidDeadline||"", notes: [r.rationale, r.next].filter(Boolean).join(" — ")
      }));
    }
    state.legacyV1 = { phases:state.phases, capTeams:state.capTeams, matrix:state.matrix, gaps:state.gaps, steps:state.steps, etimad:state.etimad, etimadExcluded:state.etimadExcluded, customSections:state.customSections };
    delete state.phases; delete state.capTeams; delete state.matrix; delete state.gaps; delete state.steps; delete state.etimad; delete state.etimadExcluded; delete state.customSections;
    state._migratedV2 = true;
  }
  migrateV3();
}

const PLACEHOLDER_PREFIX = "Connect GitHub sync above";
function isPlaceholderRow(r){
  if(typeof r === "string") return r.indexOf(PLACEHOLDER_PREFIX) === 0;
  if(!r || typeof r !== "object") return false;
  return Object.values(r).some(v=>typeof v === "string" && v.indexOf(PLACEHOLDER_PREFIX) === 0);
}
function autoCategory(r){
  const h = [r.name, r.agency, r.details, r.notes].filter(Boolean).join(" ").toLowerCase();
  const has = words => words.some(w=>h.indexOf(w) !== -1);
  if(has(["اليوم الوطني","يوم التأسيس","تأسيس الدولة","المناسبات الوطنية","national day","national occasions","founding"])) return "National Day";
  if(has(["عمرة","العمرة","الحج","الحرمين","قرآن","القرآن","umrah","hajj","pilgrim","quran"])) return "Religious/Pilgrimage";
  if(has(["سباقات","خيل","فروسية","equestrian","jockey","racing"])) return "Sports/Equestrian";
  if(has(["تطوع","تبرع","volunteer","blood-donation","charitable"])) return "Volunteering/CSR";
  if(has(["صحة","صحي","طبي","health","medical","hospital"])) return "Health";
  if(has(["مؤتمر","معرض","ملتقى","منتدى","conference","exhibition","forum","pavilion"])) return "Conference/Exhibition";
  if(has(["تراث","ثقاف","مكتبات","heritage","culture","library","libraries","visitor center"])) return "Culture/Heritage";
  if(has(["فعاليات","فعالية","احتفال","تنظيم","event","activation","awareness"])) return "Event Management";
  return "Other/Uncategorized";
}
function migrateV3(){
  Object.keys(V3_TITLE_DEFAULTS).forEach(k=>{ if(typeof state.titles[k] !== "string") state.titles[k] = V3_TITLE_DEFAULTS[k]; });
  ["phases","capTeams","matrix","gaps","programSteps","externalExcluded"].forEach(k=>{ if(!Array.isArray(state[k])) state[k] = []; });

  // never show "Connect GitHub sync above…" placeholder rows as if they were real entries
  Object.keys(state).forEach(k=>{ if(Array.isArray(state[k])) state[k] = state[k].filter(r=>!isPlaceholderRow(r)); });

  if(!state._themeV4){ state.theme = Object.assign({}, MIDWAM_DEFAULT_THEME); state._themeV4 = true; }
  if(state._migratedV3) return;
  const L = state.legacyV1 || {};
  const copy = x => JSON.parse(JSON.stringify(x));
  if(!state.phases.length && Array.isArray(L.phases)) state.phases = copy(L.phases);
  if(!state.capTeams.length && Array.isArray(L.capTeams)) state.capTeams = copy(L.capTeams);
  if(!state.matrix.length && Array.isArray(L.matrix)) state.matrix = copy(L.matrix).map(m=>({cap:m.cap||"", owner:m.owner||"", tier:m.tier||"", status:m.status||""}));
  if(!state.gaps.length && Array.isArray(L.gaps)) state.gaps = copy(L.gaps);
  if(!state.programSteps.length && Array.isArray(L.steps)) state.programSteps = copy(L.steps).map(String);
  if(!state.externalExcluded.length && Array.isArray(L.etimadExcluded)) state.externalExcluded = copy(L.etimadExcluded).map(e=>({rn:e.rn||"", name:e.name||"", agency:e.agency||"", deadline:e.deadline||"", reason:e.reason||""}));

  // put back the full tender detail the old Etimad view had (type, dates, fee, place, partners…)
  const byRn = {};
  (L.etimad||[]).forEach(e=>{ if(e && e.rn) byRn[e.rn] = e; });
  (state.external||[]).forEach(r=>{
    const e = byRn[r.rn];
    if(e) ["type","inqStart","inqDeadline","award","projStart","method","place","details","price","partners"].forEach(f=>{ if(e[f] && !r[f]) r[f] = e[f]; });
    if(!r.category || r.category === "Other/Uncategorized") r.category = autoCategory(r);
  });

  // Ownership table: fill in the owners already named elsewhere on the dashboard
  const OWNERS = [
    { match:/external|internal/i, owner:"Firas Abuzinada", basis:"Head of Business Development" },
    { match:/project/i, owner:"Sameer Gulam", basis:"Head of Operations" },
    { match:/prototype/i, owner:"Mohammed Alsanie", basis:"Head of Creative" }
  ];
  (state.raci||[]).forEach(r=>{
    if(r.owner && r.owner !== "—") return;
    const o = OWNERS.find(o=>o.match.test(r.section||""));
    if(o){ r.owner = o.owner; if(!r.basis || r.basis === "—") r.basis = o.basis; }
  });
  if((state.raci||[]).length && !state.raci.some(r=>/marketing/i.test(r.section||""))){
    state.raci.push({ section:"Marketing", owner:"Faisal Almadani", basis:"Head of Marketing" });
  }
  state._migratedV3 = true;
}

function parseDeadline(s){
  const m = String(s||"").match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function renderOverviewExtras(){
  const catEl = document.getElementById("ovCategories");
  const dlEl = document.getElementById("ovDeadlines");
  const prEl = document.getElementById("ovProgram");
  if(!catEl || !dlEl || !prEl) return;
  const ext = state.external || [];

  // categories
  const counts = {};
  ext.forEach(r=>{ const c = r.category || "Other/Uncategorized"; counts[c] = (counts[c]||0)+1; });
  const cats = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const max = cats.length ? cats[0][1] : 1;
  catEl.innerHTML = cats.length ? cats.slice(0,7).map(([c,n])=>`
    <div class="ov-bar-row">
      <div class="ov-bar-label">${escapeHtml(disp(c))}</div><div class="ov-bar-val">${n}</div>
      <div class="ov-bar-track"><div class="ov-bar-fill" style="width:${Math.max(4, n/max*100)}%"></div></div>
    </div>`).join("") : `<div class="ov-note">${escapeHtml(T().emptyRowMsg||"")}</div>`;

  // deadlines
  const today = new Date(); today.setHours(0,0,0,0);
  const dated = ext.map(r=>({ r, d:parseDeadline(r.bidDeadline) })).filter(x=>x.d);
  const upcoming = dated.filter(x=>x.d >= today).sort((a,b)=>a.d-b.d);
  const fmt = d => d.toLocaleDateString(dateLocale(), { day:"numeric", month:"short", year:"numeric" });
  if(upcoming.length){
    dlEl.innerHTML = upcoming.slice(0,5).map(x=>{
      const days = Math.round((x.d - today)/86400000);
      const col = days <= 3 ? "var(--critical)" : days <= 10 ? "var(--warning)" : "var(--good)";
      return `<div class="ov-list-item"><div><div class="t">${escapeHtml(tx(x.r.name))}</div><div class="s">${escapeHtml(tx(x.r.agency||""))} · ${fmt(x.d)}</div></div>

    const latest = dated.sort((a,b)=>b.d-a.d)[0].d;
    dlEl.innerHTML = `<div class="ov-ring-row"><div class="ov-big">0 <small>${L("open")}</small></div></div>

  } else {
    dlEl.innerHTML = `<div class="ov-note">${L("No bid deadlines logged yet.")}</div>`;
  }

  // program
  const phases = state.phases || [];
  const avg = phases.length ? Math.round(phases.reduce((s,p)=>s+(parseFloat(p.pct)||0),0)/phases.length) : 0;
  const done = phases.filter(p=>(parseFloat(p.pct)||0) >= 100).length;
  const caps = (state.matrix||[]).length;
  const live = (state.matrix||[]).filter(m=>/live|piloted|done|proven/i.test(m.status||"")).length;
  const crit = (state.gaps||[]).filter(g=>g.sev==="critical").length;
  prEl.innerHTML = phases.length ? `
    <div class="ov-ring-row"><div class="ov-big">${avg}<small>%</small></div><div class="ov-note">${LANG==="ar" ? `متوسط التقدم عبر ${phases.length} مراحل · ${done} مكتملة` : `average progress across ${phases.length} phases · ${done} complete`}</div></div>
    <div class="ov-bar-track" style="margin-bottom:14px;"><div class="ov-bar-fill" style="width:${avg}%"></div></div>
    <div class="ov-list-item"><div class="t">${L("Capabilities defined")}</div><div class="ov-bar-val">${caps}</div></div>
    <div class="ov-list-item"><div class="t">${L("Live / piloted")}</div><div class="ov-bar-val">${live}</div></div>
    <div class="ov-list-item"><div class="t">${L("Critical gaps")}</div><div class="ov-bar-val" style="color:${crit?"var(--critical)":"inherit"}">${crit}</div></div>`
    : `<div class="ov-note">${escapeHtml(T().emptyRowMsg||"")}</div>`;
}

/* ---------- Overview: pipeline-by-stage chart ---------- */
function renderPipelineChart(){
  const canvas = document.getElementById("pipelineChart");
  const emptyEl = document.getElementById("pipelineChartEmpty");
  if(!canvas) return;

  const stages = (state.stageProbs||[]).map(p=>p.stage);
  const counts = {}, values = {};
  stages.forEach(s=>{ counts[s]=0; values[s]=0; });
  (state.internal||[]).forEach(r=>{
    const s = stages.includes(r.stage) ? r.stage : null;
    if(!s) return;
    counts[s] += 1;
    values[s] += (+r.value || 0);
  });
  const data = stages.map(s=>({ stage:s, count:counts[s]||0, value:values[s]||0 })).filter(d=>d.count>0 || stages.length<=8);
  const total = data.reduce((sum,d)=>sum+d.count,0);

  const wrap = canvas.parentElement;
  const cssWidth = wrap ? wrap.clientWidth : 0;

  if(!total || !cssWidth){
    canvas.style.display = "none";
    if(emptyEl) emptyEl.style.display = total ? "none" : "block";
    return;
  }
  canvas.style.display = "block";
  if(emptyEl) emptyEl.style.display = "none";

  const dpr = window.devicePixelRatio || 1;
  const rowH = 32;
  const cssHeight = data.length * rowH + 20;
  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const styles = getComputedStyle(document.documentElement);
  const cssVar = (name, fallback) => (styles.getPropertyValue(name) || "").trim() || fallback;
  const palette = [
    cssVar("--copper", "#C1701E"), cssVar("--series-blue", "#3987e5"), cssVar("--series-orange", "#d95926"),
    cssVar("--series-aqua", "#199e70"), cssVar("--muted-bar", "#6b6456"), cssVar("--critical", "#d03b3b")
  ];
  const textColor = cssVar("--cream", "#FBF6EA");
  const mutedColor = cssVar("--muted", "#A79A82");
  const isRtl = document.documentElement.dir === "rtl";

  const labelW = 118;
  const barAreaW = Math.max(cssWidth - labelW - 20, 40);
  const barH = 16;
  const maxCount = Math.max(...data.map(d=>d.count), 1);

  ctx.font = "12px system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif";
  ctx.textBaseline = "middle";

  data.forEach((d, i)=>{
    const y = 10 + i * rowH;
    ctx.fillStyle = mutedColor;
    ctx.textAlign = "left";
    ctx.fillText(disp(d.stage), 0, y + barH/2, labelW - 8);

    const barW = Math.max((d.count / maxCount) * barAreaW, d.count > 0 ? 3 : 0);
    ctx.fillStyle = palette[i % palette.length];
    const x0 = labelW;
    const r = Math.min(4, barH/2);
    if(barW > 0){
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + barW - r, y);
      ctx.arcTo(x0 + barW, y, x0 + barW, y + r, r);
      ctx.lineTo(x0 + barW, y + barH - r);
      ctx.arcTo(x0 + barW, y + barH, x0 + barW - r, y + barH, r);
      ctx.lineTo(x0, y + barH);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = textColor;
    ctx.textAlign = "left";
    const countLabel = d.count + " " + L(d.count===1 ? "opp" : "opps");
    ctx.fillText(`${countLabel}  ·  ${d.value.toLocaleString()} ${L("SAR")}`, x0 + barW + 8, y + barH/2);
  });
}

/* ---------- global search across all sections ---------- */
const GLOBAL_SEARCH_SOURCES = [
  { section:"matrix",     page:"program",   kind:"Capability",  fields:["cap","owner","status"],     label:r=>r.cap,        sub:r=>r.owner },
  { section:"externalExcluded", page:"external", kind:"Excluded tender", fields:["name","agency","rn"], label:r=>r.name, sub:r=>r.reason },
  { section:"external",   page:"external",  kind:"Tender",      fields:["name","agency","rn"],       label:r=>r.name,       sub:r=>r.agency },
  { section:"internal",   page:"internal",  kind:"Opportunity", fields:["name","client","owner"],    label:r=>r.name,       sub:r=>r.client },
  { section:"projects",   page:"projects",  kind:"Project",     fields:["name","status"],            label:r=>r.name,       sub:r=>r.status },
  { section:"prototypes", page:"projects",  kind:"Prototype",   fields:["name","team"],              label:r=>r.name,       sub:r=>r.status },
  { section:"marketing",  page:"marketing", kind:"Campaign",    fields:["initiative","channel"],     label:r=>r.initiative, sub:r=>r.status },
  { section:"tasks",      page:"tasks",     kind:"Task",        fields:["task","owner","notes"],     label:r=>r.task,       sub:r=>r.owner },
  { section:"milestones", page:"tasks",     kind:"Milestone",   fields:["milestone","owner","notes"],label:r=>r.milestone,  sub:r=>r.owner },
  { section:"todos",      page:"tasks",     kind:"To-do",       fields:["item","owner","notes"],     label:r=>r.item,       sub:r=>r.owner }
];

function globalSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  GLOBAL_SEARCH_SOURCES.forEach(src=>{
    (state[src.section]||[]).forEach((r,i)=>{
      const hay = src.fields.map(f=>String(r[f]||"")).join(" ␀ ").toLowerCase();
      if(hay.includes(q)){
        results.push({
          section: src.section, page: src.page, index: i, kind: src.kind,
          label: src.label(r) || "(untitled)", sub: src.sub(r) || ""
        });
      }
    });
  });
  return results.slice(0, 30);
}

function goToSearchResult(section, page, index){
  switchPage(page);
  setTimeout(()=>{
    const target = document.querySelector(`[data-bind^="${section}.${index}."]`);
    if(!target) return;
    const sec = target.closest("section");
    if(sec) sec.classList.remove("collapsed");
    const row = target.closest("tr") || target;
    row.scrollIntoView({ behavior:"smooth", block:"center" });
    row.querySelectorAll ? row.querySelectorAll("[data-bind]").forEach(c=>{
      c.classList.remove("flash-highlight"); void c.offsetWidth; c.classList.add("flash-highlight");
    }) : null;
  }, 40);
}

function renderGlobalSearchResults(){
  const input = document.getElementById("globalSearch");
  const wrap = document.getElementById("globalSearchResults");
  if(!input || !wrap) return;
  const q = input.value;
  if(!q.trim()){ wrap.classList.remove("show"); wrap.innerHTML = ""; return; }
  const results = globalSearch(q);
  const t = T();
  wrap.innerHTML = results.length
    ? results.map(r=>`
        <div class="gsr-item" data-gopage="${r.page}" data-gosection="${r.section}" data-goindex="${r.index}">
          <div class="gsr-sec">${escapeHtml(L(r.kind))}</div>
          <div class="gsr-title">${escapeHtml(tx(r.label))}</div>
          ${r.sub ? `<div class="gsr-sub">${escapeHtml(tx(r.sub))}</div>` : ""}
        </div>`).join("")
    : `<div class="gsr-empty">${escapeHtml(t.globalSearchEmpty || "No matches")}</div>`;
  wrap.querySelectorAll("[data-gopage]").forEach(item=>{
    item.addEventListener("click", ()=>{
      goToSearchResult(item.dataset.gosection, item.dataset.gopage, +item.dataset.goindex);
      wrap.classList.remove("show");
      input.value = "";
    });
  });
  wrap.classList.add("show");
}

document.addEventListener("DOMContentLoaded", ()=>{
  const gs = document.getElementById("globalSearch");
  if(gs){
    gs.addEventListener("input", renderGlobalSearchResults);
    gs.addEventListener("focus", ()=>{ if(gs.value.trim()) renderGlobalSearchResults(); });
    gs.addEventListener("keydown", e=>{
      if(e.key === "Escape"){ gs.value=""; document.getElementById("globalSearchResults").classList.remove("show"); gs.blur(); }
    });
  }
  document.addEventListener("click", e=>{
    const wrap = document.getElementById("globalSearchResults");
    const box = document.querySelector(".global-search-wrap");
    if(wrap && box && !box.contains(e.target)) wrap.classList.remove("show");
  });
});

/* ---------- editing: generic contenteditable -> state binding ---------- */
document.addEventListener("focusin", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.bind || !editing) return;
  if(t._historySnapped) return;
  t._historySnapped = true;
  pushHistory();
});
document.addEventListener("focusout", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.bind) return;
  t._historySnapped = false;
  const path = t.dataset.bind.split(".");
  if(path[0] === "titles" && LANG === "ar"){
    state.titlesAr = state.titlesAr || {};
    state.titlesAr[path[1]] = t.innerText.trim();
    saveLocalDraft();
    return;
  }
  let obj = state;
  for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
  obj[path[path.length-1]] = t.innerText.trim();
  if(path[0] === "stageProbs" && path[path.length-1] === "stage"){ renderInternal(); applyEditMode(); }
  if(path[0] === "titles" && path[1] === "h1" && state.titles.h1) document.title = state.titles.h1;
  saveLocalDraft();
});

function applyEditMode(){
  fillEmptyStates();
  document.querySelectorAll("[data-bind]").forEach(el=>el.setAttribute("contenteditable", editing ? "true" : "false"));
  document.querySelectorAll(".edit-only").forEach(el=>el.style.display = editing ? "" : "none");
  document.querySelectorAll(".view-only").forEach(el=>el.style.display = editing ? "none" : "");
  document.querySelectorAll(".addbtn").forEach(el=>el.classList.toggle("show", editing));
  document.getElementById("saveBtn").style.display = editing ? "inline-block" : "none";
  document.getElementById("undoBtn").disabled = history.length === 0;
}

const LOCAL_DRAFT_KEY = "saudDashboardLocalDraft";
function saveLocalDraft(){
  if(READONLY || window.__skipSave) return;
  scheduleTranslate();
  try{
    localStorage.setItem(LOCAL_DRAFT_KEY, JSON.stringify(state));
    const ind = document.getElementById("autosaveIndicator");
    const timeEl = document.getElementById("autosaveTime");
    if(ind && timeEl){
      window.__lastSaved = new Date();
      timeEl.innerText = L("Saved locally") + " " + new Date().toLocaleTimeString(LANG==="ar" ? "ar-u-nu-latn" : [], {hour:"2-digit", minute:"2-digit"});
      ind.classList.add("show");
    }
  } catch(e){ /* ignore quota/availability errors */ }
  scheduleGithubAutosave();
}
function loadLocalDraft(){
  try{
    const raw = localStorage.getItem(LOCAL_DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function dismissLocalDraft(){
  document.getElementById("draftBanner").classList.remove("show");
}
function discardLocalDraft(){
  try{ localStorage.removeItem(LOCAL_DRAFT_KEY); } catch(e){}
  pushHistory();
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  document.getElementById("draftBanner").classList.remove("show");
  renderAll();
  showToast("Draft discarded");
}
