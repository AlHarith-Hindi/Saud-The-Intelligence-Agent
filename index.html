<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Saud — Business Tracking Dashboard</title>
<style>
  :root{
    --night:   #1F1B16;
    --night2:  #2B241C;
    --sand:    #E4D5B0;
    --copper:  #C1701E;
    --cream:   #FBF6EA;
    --dark:    #2A2018;
    --card:    #F5EFE1;
    --muted:   #A79A82;
    --border:  rgba(255,255,255,0.08);
    --good:      #0ca30c;
    --warning:   #d99a1a;
    --serious:   #ec835a;
    --critical:  #d03b3b;
    --series-blue:   #3987e5;
    --series-orange: #d95926;
    --series-aqua:   #199e70;
    --muted-bar: #6b6456;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: system-ui, -apple-system, "Segoe UI", "Tahoma", sans-serif;
    background: var(--night); color: var(--cream);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:32px 24px 80px;}
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:28px; flex-wrap:wrap;}
  header .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--copper); font-weight:700; margin-bottom:6px;}
  header h1{margin:0; font-size:28px; font-weight:700; color:var(--cream);}
  header p{margin:6px 0 0; color:var(--muted); font-size:14px;}
  [data-bind][contenteditable="true"]{outline:1px dashed var(--copper); border-radius:4px; padding:1px 4px;}
  .meta{text-align:right; font-size:12px; color:var(--muted);}
  .meta span{display:block;}
  .meta .lastup-row{display:flex; align-items:center; justify-content:flex-end; gap:6px;}
  .meta .tinybtn{background:none; border:1px solid var(--border); color:var(--muted); font-size:9px; padding:1px 6px; border-radius:5px; cursor:pointer;}
  .meta .tinybtn:hover{color:var(--cream); border-color:var(--copper);}
  .editbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  button.editbtn{
    background:var(--copper); color:var(--cream); border:none; border-radius:8px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  button.editbtn.secondary{background:transparent; border:1px solid var(--border); color:var(--sand);}
  button.editbtn:disabled{opacity:.45; cursor:default;}
  button.editbtn:hover:not(:disabled){opacity:.9;}
  .autosave-indicator{font-size:10.5px; color:var(--muted); display:none; align-items:center; gap:4px;}
  .autosave-indicator.show{display:flex;}

  /* read-only viewer build: hide every editing/sync control, no exceptions */
  body.readonly #toggleEdit, body.readonly #undoBtn, body.readonly #saveBtn,
  body.readonly #toggleSync, body.readonly #syncPanel, body.readonly #draftBanner,
  body.readonly .autosave-indicator{ display:none !important; }

  .sync-panel{
    background:var(--night2); border:1px solid var(--border); border-radius:12px; padding:18px 20px;
    margin-bottom:24px; display:none; font-size:13px; color:var(--sand); line-height:1.6;
  }
  .sync-panel.open{display:block;}
  .sync-panel .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .sync-panel input{
    background:var(--night); border:1px solid #4A3E2C; color:var(--cream); padding:8px 12px; border-radius:6px;
    font-size:13px;
  }
  .sync-panel input.token{width:340px;}
  .sync-panel input.short{width:150px;}
  .sync-panel input[type="color"]{
    width:36px; height:32px; padding:2px; border-radius:6px; border:1px solid #4A3E2C; background:var(--night); cursor:pointer;
  }
  .sync-panel ul{margin:8px 0 0; padding-left:20px;}
  .sync-panel li{margin-bottom:6px;}
  .sync-panel kbd{background:var(--night); border:1px solid #4A3E2C; border-radius:4px; padding:1px 6px; font-size:11px; font-family:inherit;}
  .theme-swatch{
    width:28px; height:28px; border-radius:50%; border:2px solid rgba(255,255,255,.2); cursor:pointer; flex-shrink:0;
  }
  .theme-swatch.active{border-color:var(--cream); box-shadow:0 0 0 2px var(--copper);}
  .sync-status{margin-top:10px; font-size:12px; color:var(--muted);}
  .sync-status.ok{color:#5fd3a8;}
  .sync-status.err{color:#f0a06f;}

  .stat-row{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:28px;}
  .stat-tile{
    background:var(--night2); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; position:relative;
  }
  .stat-tile .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px;}
  .stat-tile .icon{font-size:15px; margin-right:6px;}
  .stat-tile .value{font-size:24px; font-weight:700; color:var(--copper); font-variant-numeric:proportional-nums;}
  .stat-tile .sub{font-size:12px; color:var(--muted); margin-top:4px;}

  section{margin-bottom:32px;}
  section .sechead{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); margin-bottom:14px; padding-bottom:8px; flex-wrap:wrap; gap:8px;}
  section h2{
    font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--sand);
    margin:0; background:none; border:none; font-family:inherit;
  }
  .sechead-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .addbtn{background:none; border:1px dashed var(--copper); color:var(--sand); font-size:11px; padding:4px 10px; border-radius:6px; cursor:pointer; display:none;}
  .addbtn.show{display:inline-block;}
  .reorder{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 3px; line-height:1;}
  .reorder:hover{color:var(--copper);}
  .reorder:disabled{opacity:.25; cursor:default;}
  .dupbtn{background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 3px; line-height:1;}
  .dupbtn:hover{color:var(--series-blue);}
  .reordergrp{display:flex; flex-direction:column;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); align-items:center;}
  .legend .litem{display:flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0;}

  .draft-banner{
    background:rgba(193,112,30,.12); border:1px solid var(--copper); border-radius:10px; padding:10px 16px;
    margin-bottom:20px; font-size:12.5px; color:var(--sand); display:none; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .draft-banner.show{display:flex;}
  .draft-banner button{background:none; border:1px solid var(--border); color:var(--sand); border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer;}
  .draft-banner button:hover{border-color:var(--copper); color:var(--cream);}
  .row-search{
    background:var(--night); border:1px solid var(--border); color:var(--cream); border-radius:8px;
    padding:7px 12px; font-size:12.5px; width:240px; margin-bottom:10px;
  }
  section.collapsed > *:not(.sechead){display:none;}
  .sechead h2{cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px;}
  .sechead h2::before{content:"▾"; font-size:9px; opacity:.55;}
  section.collapsed .sechead h2::before{content:"▸";}

  table{width:100%; border-collapse:collapse; background:var(--night2); border-radius:12px; overflow:hidden;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--border); font-weight:600;
  }
  thead th.actions{width:90px;}
  tbody td{padding:9px 12px; font-size:13.5px; border-bottom:1px solid var(--border); color:var(--cream); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  td.actions-cell{display:flex; gap:4px; align-items:center;}
  .pill{display:inline-block; padding:2px 9px; border-radius:5px; font-size:11px; font-weight:700;}
  input[type="color"].tiny{width:26px; height:24px; padding:1px; border-radius:5px; border:1px solid var(--border); background:var(--night); cursor:pointer;}
  .rowdel{background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; border-radius:4px; padding:0 3px;}
  .rowdel:hover{color:var(--critical);}
  .rowdel.confirming{background:var(--critical); color:#fff; font-size:10px; padding:2px 6px;}
  .status-select{border:none; border-radius:6px; padding:4px 8px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; field-sizing:content; min-width:60px; max-width:220px;}
  .status-pill{display:inline-block; padding:2px 9px; border-radius:5px; font-size:11px; font-weight:700;}

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px; margin-bottom:18px;}
  .table-scroll{overflow-x:auto; border-radius:12px;}
  .wide-table td, .wide-table th{vertical-align:top; white-space:normal; max-width:280px;}

  .prob-table{width:100%; max-width:380px; border-collapse:collapse; background:var(--night2); border-radius:12px; overflow:hidden; margin-top:4px;}
  .prob-table th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--border);}
  .prob-table td{padding:7px 12px; font-size:13px; border-bottom:1px solid var(--border);}
  .prob-table tr:last-child td{border-bottom:none;}
  .prob-table input[type=number]{width:60px; background:var(--night); border:1px solid var(--border); color:var(--cream); border-radius:5px; padding:3px 6px; font-size:12px;}
  .prob-note{font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5;}

  .todo-row.done td{ opacity:.55; text-decoration:line-through; }
  input[type="checkbox"].donecheck{ width:16px; height:16px; cursor:pointer; }

  .notes{background:var(--night2); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-height:70px; font-size:13.5px; color:var(--sand); line-height:1.6;}
  .footer-note{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6; background:none; border:none; font-family:inherit; width:100%;}
  .subhead{font-size:12px; color:var(--muted); margin:-6px 0 12px; line-height:1.5;}

  .overview-nav{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .overview-nav .navcard{background:var(--night2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; text-align:left; width:100%; font-family:inherit;}
  .overview-nav .navcard:hover{border-color:var(--copper);}
  .overview-nav .navcard .t{font-size:14px; font-weight:700; color:var(--cream); margin-bottom:4px;}
  .overview-nav .navcard .d{font-size:12px; color:var(--muted); line-height:1.4;}
  .overview-nav .navcard .o{font-size:11px; color:var(--copper); margin-top:6px; font-style:italic;}

  .team-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
  .teamcard{background:var(--night2); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .teamcard-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .teamcard-name{font-size:15px; font-weight:700; color:var(--cream);}
  .teamcard-title{font-size:12.5px; color:var(--copper); margin-top:2px; font-weight:600;}
  .teamcard-reports{font-size:11.5px; color:var(--muted); margin-top:8px; font-style:italic;}
  .teamcard-label{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-top:10px; margin-bottom:4px;}
  .teamcard-resp{font-size:13px; color:var(--sand); line-height:1.6; white-space:pre-line;}
  .teamcard-actions{display:flex; gap:4px; align-items:center; margin-top:10px;}

  .fill-note{background:rgba(217,154,26,.14); }

  .toast-container{position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:9999;}
  .toast{
    background:var(--night2); border:1px solid var(--copper); color:var(--cream); padding:10px 16px; border-radius:8px;
    font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.35); opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;
    max-width:320px;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  /* ---------- page tabs ---------- */
  .tabs-nav{display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:0; flex-wrap:wrap;}
  .tab-btn{
    background:none; border:none; color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer;
    padding:10px 4px; margin-right:18px; border-bottom:2px solid transparent; font-family:inherit;
  }
  .tab-btn:hover{color:var(--cream);}
  .tab-btn.active{color:var(--cream); border-bottom-color:var(--copper);}
  .page{display:none;}
  .page.active{display:block;}

  @media (max-width:820px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .overview-nav{grid-template-columns:1fr;}
    .team-grid{grid-template-columns:1fr;}
  }

  @media print{
    .editbar, .sync-panel, .edit-only, .reordergrp, .rowdel, .dupbtn, .addbtn, .toast-container, .autosave-indicator,
    thead th.actions, td.actions-cell, .row-search, .draft-banner, .tabs-nav, .teamcard-actions{ display:none !important; }
    .page{ display:block !important; }
    body{ background:#fff; color:#111; }
    .stat-tile, .notes, table, .prob-table{ background:#f4f4f4; border-color:#ccc; }
    section.collapsed > *:not(.sechead){ display:block !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand" id="brandEl" data-bind="titles.brand"></div>
      <h1 id="h1El" data-bind="titles.h1"></h1>
      <p id="subtitleEl" data-bind="titles.subtitle"></p>
    </div>
    <div style="display:flex; flex-direction:column; align-items:flex-end; gap:10px;">
      <div class="meta">
        <div class="lastup-row">
          <span><span data-bind="titles.labelLastUpdated"></span> <span id="lastUpdatedText" data-bind="lastUpdated"></span></span>
          <button class="tinybtn edit-only" id="setTodayBtn"><span data-bind="titles.btnSetToday"></span></button>
        </div>
        <span id="ownerLineEl" data-bind="titles.ownerLine"></span>
        <span class="autosave-indicator" id="autosaveIndicator">💾 <span id="autosaveTime"></span></span>
      </div>
      <div class="editbar">
        <button class="editbtn secondary" id="exportPptxBtn" onclick="exportPPTX()"><span data-bind="titles.btnExportPptx"></span></button>
        <button class="editbtn secondary" id="printBtn" onclick="window.print()"><span data-bind="titles.btnPrint"></span></button>
        <button class="editbtn secondary" id="toggleTheme"><span data-bind="titles.btnTheme"></span></button>
        <button class="editbtn secondary" id="toggleSync"><span data-bind="titles.btnGithubSync"></span></button>
        <button class="editbtn secondary edit-only" id="undoBtn" disabled><span data-bind="titles.btnUndo"></span></button>
        <button class="editbtn secondary" id="toggleEdit"><span data-bind="titles.btnEdit"></span></button>
        <button class="editbtn" id="saveBtn" style="display:none;"><span data-bind="titles.btnSaveToGithub"></span></button>
      </div>
    </div>
  </header>

  <div class="draft-banner" id="draftBanner">
    <span data-bind="titles.draftRestoredMsg"></span>
    <span>
      <button onclick="dismissLocalDraft()" data-bind="titles.btnDismissDraft"></button>
      <button onclick="discardLocalDraft()" data-bind="titles.btnDiscardDraft"></button>
    </span>
  </div>

  <div class="sync-panel" id="themePanel">
    <b data-bind="titles.themeHeading"></b><br>
    <span data-bind="titles.themeDesc"></span>
    <div class="row" id="themePresets"></div>
    <div class="row" style="align-items:center;">
      <span style="font-size:12px; color:var(--muted);" data-bind="titles.labelAccentColor"></span>
      <input type="color" id="accentPicker" value="#C1701E">
      <span style="font-size:12px; color:var(--muted); margin-left:14px;" data-bind="titles.labelBackgroundColor"></span>
      <input type="color" id="bgPicker" value="#1F1B16">
      <span style="font-size:12px; color:var(--muted); margin-left:14px;" data-bind="titles.labelTextColor"></span>
      <input type="color" id="textPicker" value="#FBF6EA">
      <button class="editbtn secondary" onclick="resetTheme()"><span data-bind="titles.btnResetTheme"></span></button>
    </div>
  </div>

  <div class="sync-panel" id="syncPanel">
    <b data-bind="titles.githubSyncHeading"></b><br>
    <span data-bind="titles.githubSyncDesc"></span>
    <div class="row">
      <input class="token" type="password" id="ghToken" placeholder="GitHub personal access token (ghp_...)">
      <input class="short" type="text" id="ghOwner" placeholder="repo owner / org">
      <input class="short" type="text" id="ghRepo" placeholder="repo name">
      <input class="short" type="text" id="ghPath" placeholder="file path" value="saud-dashboard-data.json">
      <input class="short" type="text" id="ghBranch" placeholder="branch" value="main">
      <button class="editbtn" onclick="connectGitHub()"><span data-bind="titles.btnConnectLoad"></span></button>
    </div>
    <div class="sync-status" id="syncStatus" data-bind="titles.syncNotConnectedMsg"></div>
  </div>

  <div class="tabs-nav" id="tabsNav">
    <button class="tab-btn active" data-page="overview" onclick="switchPage('overview')"><span data-bind="titles.tabOverview"></span></button>
    <button class="tab-btn" data-page="external" onclick="switchPage('external')"><span data-bind="titles.tabExternal"></span></button>
    <button class="tab-btn" data-page="internal" onclick="switchPage('internal')"><span data-bind="titles.tabInternal"></span></button>
    <button class="tab-btn" data-page="projects" onclick="switchPage('projects')"><span data-bind="titles.tabProjects"></span></button>
    <button class="tab-btn" data-page="marketing" onclick="switchPage('marketing')"><span data-bind="titles.tabMarketing"></span></button>
    <button class="tab-btn" data-page="tasks" onclick="switchPage('tasks')"><span data-bind="titles.tabTasks"></span></button>
    <button class="tab-btn" data-page="notes" onclick="switchPage('notes')"><span data-bind="titles.tabNotes"></span></button>
  </div>

  <!-- ============================== OVERVIEW ============================== -->
  <div class="page active" id="page-overview">
    <div class="stat-row" id="statRow"></div>
    <section>
      <div class="sechead"><h2 data-bind="titles.sectionOverviewNav"></h2></div>
      <div class="overview-nav" id="overviewNav"></div>
    </section>
  </div>

  <!-- ============================== EXTERNAL ============================== -->
  <div class="page" id="page-external">
    <section>
      <div class="sechead">
        <h2 id="secExternalTitle" data-bind="titles.sectionExternal"></h2>
        <div class="sechead-actions">
          <button class="editbtn secondary" id="exportExternalExcelBtn" onclick="exportExternalExcel()"><span data-bind="titles.btnExportExcel"></span></button>
          <button class="addbtn" onclick="addRow('external', {rn:'', name:'New tender', agency:'', fit:'Unknown', category:'Other/Uncategorized', bidDeadline:'', notes:''})"><span data-bind="titles.addBtnTender"></span></button>
        </div>
      </div>
      <div class="subhead" data-bind="titles.externalOwnerLine"></div>
      <div class="kpi-row" id="externalKpis"></div>
      <input type="text" class="row-search" id="externalSearch" placeholder="🔎 Search competition name, agency, or RN...">
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colExtRn"></th><th data-bind="titles.colExtName"></th><th data-bind="titles.colExtAgency"></th>
            <th data-bind="titles.colExtFit"></th><th data-bind="titles.colExtCategory"></th><th data-bind="titles.colExtDeadline"></th>
            <th data-bind="titles.colExtNotes"></th><th class="actions"></th>
          </tr></thead>
          <tbody id="externalBody"></tbody>
        </table>
      </div>
      <div class="footer-note" data-bind="titles.externalFooterNote"></div>
    </section>

    <section>
      <div class="sechead">
        <h2 data-bind="titles.sectionNews"></h2>
        <button class="addbtn" onclick="addRow('news', {date:'', source:'', headline:'New headline', relevance:'', link:'', notes:''})"><span data-bind="titles.addBtnNewsItem"></span></button>
      </div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colNewsDate"></th><th data-bind="titles.colNewsSource"></th><th data-bind="titles.colNewsHeadline"></th>
            <th data-bind="titles.colNewsRelevance"></th><th data-bind="titles.colNewsLink"></th><th data-bind="titles.colNewsNotes"></th>
            <th class="actions"></th>
          </tr></thead>
          <tbody id="newsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- ============================== INTERNAL PERFORMANCE ============================== -->
  <div class="page" id="page-internal">
    <section>
      <div class="sechead">
        <h2 id="secInternalTitle" data-bind="titles.sectionInternal"></h2>
        <button class="addbtn" onclick="addRow('internal', {name:'New opportunity', client:'', value:0, stage:'Not started', subDate:'', nextStep:'', owner:''})"><span data-bind="titles.addBtnOpportunity"></span></button>
      </div>
      <div class="subhead" data-bind="titles.internalOwnerLine"></div>
      <div class="kpi-row" id="internalKpis"></div>
      <div class="table-scroll">
        <table class="wide-table">
          <thead><tr>
            <th data-bind="titles.colIntName"></th><th data-bind="titles.colIntClient"></th><th data-bind="titles.colIntValue"></th>
            <th data-bind="titles.colIntStage"></th><th data-bind="titles.colIntSubDate"></th><th data-bind="titles.colIntNext"></th>
            <th data-bind="titles.colIntOwner"></th><th data-bind="titles.colIntWeighted"></th><th class="actions"></th>
          </tr></thead>
          <tbody id="internalBody"></tbody>
        </table>
      </div>
      <div class="footer-note" data-bind="titles.internalFooterNote"></div>
    </section>

/* ---------- undo history ---------- */
let history = [];
const HISTORY_LIMIT = 25;
function pushHistory(){
  try{
    history.push(JSON.stringify(state));
    if(history.length > HISTORY_LIMIT) history.shift();
    const btn = document.getElementById("undoBtn");
    if(btn) btn.disabled = false;
  } catch(e){}
}
function undo(){
  if(!history.length) return;
  const prev = history.pop();
  state = JSON.parse(prev);
  renderAll();
  const btn = document.getElementById("undoBtn");
  if(btn) btn.disabled = history.length === 0;
  showToast("Undone");
}

/* ---------- toasts ---------- */
function showToast(msg){
  const c = document.getElementById("toastContainer");
  if(!c) return;
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  c.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("show"));
  setTimeout(()=>{
    t.classList.remove("show");
    setTimeout(()=>t.remove(), 250);
  }, 2600);
}

/* ---------- inline click-to-confirm delete ---------- */
function confirmDelete(btn, fn){
  if(btn.dataset.confirming === "1"){
    clearTimeout(btn._confirmTimer);
    fn();
    return;
  }
  btn.dataset.confirming = "1";
  btn.dataset.origText = btn.textContent;
  btn.textContent = "Confirm?";
  btn.classList.add("confirming");
  btn._confirmTimer = setTimeout(()=>{
    btn.dataset.confirming = "";
    btn.textContent = btn.dataset.origText || "✕";
    btn.classList.remove("confirming");
  }, 2500);
}

function hexToRgb(hex){
  hex = hex.replace("#","");
  if(hex.length===3) hex = hex.split("").map(c=>c+c).join("");
  const n = parseInt(hex,16);
  return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
}
function lighten(hex, amt){
  const { r,g,b } = hexToRgb(hex);
  return rgbToHex(r+(255-r)*amt, g+(255-g)*amt, b+(255-b)*amt);
}
function darken(hex, amt){
  const { r,g,b } = hexToRgb(hex);
  return rgbToHex(r*(1-amt), g*(1-amt), b*(1-amt));
}
function relLuminance(hex){
  const { r,g,b } = hexToRgb(hex);
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

function applyTheme(theme){
  if(!theme.text) theme.text = "#FBF6EA";
  const root = document.documentElement.style;
  root.setProperty("--copper", theme.accent);
  root.setProperty("--night", theme.bg);
  root.setProperty("--cream", theme.text);
  const light = relLuminance(theme.bg) > 0.5;
  root.setProperty("--night2", light ? darken(theme.bg, 0.05) : lighten(theme.bg, 0.06));
  root.setProperty("--border", light ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.08)");
  renderThemePanel();
}

function renderThemePanel(){
  const wrap = document.getElementById("themePresets");
  if(!wrap) return;

  THEME_PRESETS.forEach(p=>{
    const active = state.theme.accent.toLowerCase()===p.accent.toLowerCase() && state.theme.bg.toLowerCase()===p.bg.toLowerCase();
    const sw = document.createElement("div");
    sw.className = "theme-swatch" + (active ? " active" : "");
    sw.title = p.name;
    sw.style.background = `linear-gradient(135deg, ${p.accent} 50%, ${p.bg} 50%)`;
    sw.onclick = ()=>{ pushHistory(); state.theme = { accent:p.accent, bg:p.bg, text:p.text }; applyTheme(state.theme); syncThemeInputs(); saveLocalDraft(); };
    wrap.appendChild(sw);

  syncThemeInputs();
}

/* ---------- migration from any older saved shape ---------- */
function migrateState(){
  if(!state.theme) state.theme = { accent:"#C1701E", bg:"#1F1B16", text:"#FBF6EA" };
  if(!state.theme.text) state.theme.text = "#FBF6EA";
  if(!state.titles) state.titles = {};
  Object.keys(DEFAULT_STATE.titles).forEach(k=>{
    if(typeof state.titles[k] !== "string") state.titles[k] = DEFAULT_STATE.titles[k];
  });
  const arrayFields = ["external","news","internal","stageProbs","projects","prototypes","marketing","tasks","milestones","todos","raci","team","sources","methodology"];
  arrayFields.forEach(k=>{ if(!Array.isArray(state[k])) state[k] = JSON.parse(JSON.stringify(DEFAULT_STATE[k])); });
  if(typeof state.notes !== "string") state.notes = DEFAULT_STATE.notes;

  /* one-time best-effort carry-over from the old phases/matrix/etimad dashboard shape,
     so a private data file saved under the previous version doesn't just vanish —
     only runs the first time a legacy file is loaded (no state.external yet AND old
     state.etimad present), and stashes anything it can't cleanly map into state.legacyV1
     rather than silently dropping it. */
  if(Array.isArray(state.etimad) && !state._migratedV2){
    if(!state.external || !state.external.length || state.external[0].name === DEFAULT_STATE.external[0].name){
      state.external = state.etimad.map(r=>({
        rn: r.rn||"", name: r.name||"", agency: r.agency||"",
        fit: FIT_COLOR[r.fit] ? r.fit : "Unknown",
        category: "Other/Uncategorized",
        bidDeadline: r.bidDeadline||"", notes: [r.rationale, r.next].filter(Boolean).join(" — ")
      }));
    }
    state.legacyV1 = { phases:state.phases, capTeams:state.capTeams, matrix:state.matrix, gaps:state.gaps, steps:state.steps, etimad:state.etimad, etimadExcluded:state.etimadExcluded, customSections:state.customSections };
    delete state.phases; delete state.capTeams; delete state.matrix; delete state.gaps; delete state.steps; delete state.etimad; delete state.etimadExcluded; delete state.customSections;
    state._migratedV2 = true;
  }
}

/* ---------- generic reorder / duplicate / add / remove (works for any state[section] array) ---------- */
function reorderBtns(section, i, len){
  const t = state.titles;
  const upTip = escapeHtml(t.iconMoveUpTip || "Move up");
  const downTip = escapeHtml(t.iconMoveDownTip || "Move down");
  const dupTip = escapeHtml(t.iconDuplicateTip || "Duplicate");
  return `<span class="reordergrp edit-only">
      <button class="reorder" onclick="moveItem('${section}',${i},-1)" ${i===0?"disabled":""} title="${upTip}">▲</button>
      <button class="reorder" onclick="moveItem('${section}',${i},1)" ${i===len-1?"disabled":""} title="${downTip}">▼</button>
    </span>
    <button class="dupbtn edit-only" onclick="duplicateRow('${section}',${i})" title="${dupTip}">⧉</button>`;
}
function moveItem(section, i, dir){
  const arr = state[section];
  const j = i + dir;
  if(j < 0 || j >= arr.length) return;
  pushHistory();
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  RENDER_FN[section]();
  applyEditMode();
  saveLocalDraft();
}
function duplicateRow(section, i){
  pushHistory();
  const clone = JSON.parse(JSON.stringify(state[section][i]));
  state[section].splice(i+1, 0, clone);
  RENDER_FN[section]();
  applyEditMode();
  saveLocalDraft();
  showToast("Duplicated");
}
function addRow(section, template){
  pushHistory();
  state[section].push(JSON.parse(JSON.stringify(template)));
  RENDER_FN[section]();
  applyEditMode();
  saveLocalDraft();
  showToast("Added");
}
function addStringRow(section, text){
  pushHistory();
  state[section].push(text);
  RENDER_FN[section]();
  applyEditMode();
  saveLocalDraft();
  showToast("Added");
}
function removeRow(section, i){
  pushHistory();
  state[section].splice(i,1);
  RENDER_FN[section]();
  applyEditMode();
  saveLocalDraft();
  showToast("Removed");
}

document.addEventListener("focusin", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.bind || !editing) return;
  if(t._historySnapped) return;
  t._historySnapped = true;
  pushHistory();
});
document.addEventListener("focusout", e=>{
  const t = e.target;
  if(!t.dataset || !t.dataset.bind) return;
  t._historySnapped = false;
  const path = t.dataset.bind.split(".");
  let obj = state;
  for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
  obj[path[path.length-1]] = t.innerText.trim();
  if(path[0] === "stageProbs" && path[path.length-1] === "stage"){ renderInternal(); applyEditMode(); }
  if(path[0] === "titles" && path[1] === "h1" && state.titles.h1) document.title = state.titles.h1;
  saveLocalDraft();
});

function b64EncodeUnicode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b=>bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64DecodeUnicode(b64){
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function ghApiUrl(){ return `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.path}?ref=${gh.branch}`; }

async function connectGitHub(){
  gh.token  = document.getElementById("ghToken").value.trim();
  gh.owner  = document.getElementById("ghOwner").value.trim();
  gh.repo   = document.getElementById("ghRepo").value.trim();
  gh.path   = document.getElementById("ghPath").value.trim() || "saud-dashboard-data.json";
  gh.branch = document.getElementById("ghBranch").value.trim() || "main";
  const statusEl = document.getElementById("syncStatus");
  if(!gh.token || !gh.owner || !gh.repo){
    statusEl.className = "sync-status err";
    statusEl.innerText = "Fill in the token, repo owner, and repo name first.";
    return;
  }
  statusEl.className = "sync-status";
  statusEl.innerText = "Connecting...";
  try{
    const resp = await fetch(ghApiUrl(), {
      headers:{ "Authorization":"Bearer "+gh.token, "Accept":"application/vnd.github+json" }
    });
    if(resp.status === 404){
      gh.connected = true; gh.sha = null;
      statusEl.className = "sync-status ok";
      statusEl.innerText = "Connected. No saved file yet at this path — click \"Edit\" then \"Save to GitHub\" to create it with the current content.";
      return;
    }
    if(!resp.ok){
      const err = await resp.json().catch(()=>({}));
      statusEl.className = "sync-status err";
      statusEl.innerText = "Connection failed (" + resp.status + "): " + (err.message || "check the token and repo details.");
      return;
    }
    const data = await resp.json();
    gh.sha = data.sha;
    const content = b64DecodeUnicode(data.content.replace(/\n/g,""));
    const loaded = JSON.parse(content);
    state = loaded;
    gh.connected = true;
    dismissLocalDraft();
    renderAll();
    statusEl.className = "sync-status ok";
    statusEl.innerText = "Connected and loaded from GitHub. Every future save writes a new commit to this file.";
  } catch(e){
    statusEl.className = "sync-status err";
    statusEl.innerText = "Connection failed — " + e.message;
  }
}

async function saveToGitHub(){
  const statusEl = document.getElementById("syncStatus");
  if(!gh.connected){
    document.getElementById("syncPanel").classList.add("open");
    statusEl.className = "sync-status err";
    statusEl.innerText = "Connect GitHub sync first (top right) — otherwise this edit only lasts for this tab.";
    return;
  }
  const btn = document.getElementById("saveBtn");
  const origBtnHTML = btn.innerHTML;
  btn.disabled = true; btn.innerText = "Saving...";
  try{
    const body = {
      message: "Update Saud dashboard — " + new Date().toISOString(),
      content: b64EncodeUnicode(JSON.stringify(state, null, 2)),
      branch: gh.branch
    };
    if(gh.sha) body.sha = gh.sha;
    const resp = await fetch(ghApiUrl().split("?")[0], {
      method:"PUT",
      headers:{ "Authorization":"Bearer "+gh.token, "Accept":"application/vnd.github+json", "content-type":"application/json" },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if(!resp.ok){
      statusEl.className = "sync-status err";
      statusEl.innerText = "Save failed (" + resp.status + "): " + (data.message || "unknown error");
      return;
    }
    gh.sha = data.content.sha;
    statusEl.className = "sync-status ok";
    statusEl.innerText = "Saved — commit " + data.commit.sha.slice(0,7) + " at " + new Date().toLocaleTimeString() + ". Full history is on GitHub.";
    showToast("Saved to GitHub");
  } catch(e){
    statusEl.className = "sync-status err";
    statusEl.innerText = "Save failed — " + e.message;
  } finally {
    btn.disabled = false; btn.innerHTML = origBtnHTML;
  }
}
document.getElementById("saveBtn").addEventListener("click", saveToGitHub);

/* ---------- Excel export (External tenders) ---------- */
function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement("script");
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error("Failed to load " + src));
    document.head.appendChild(s);
  });
}

async function exportExternalExcel(){
  const btn = document.getElementById("exportExternalExcelBtn");
  const orig = btn.innerHTML;
  btn.disabled = true; btn.textContent = "Building...";
  try{
    if(typeof ExcelJS === "undefined"){
      await loadScriptOnce("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js");
    }
    const wb = new ExcelJS.Workbook();
    const dateStr = new Date().toISOString().slice(0,10);
    const ws = wb.addWorksheet("External Tenders");
    const headers = ["RN","Competition Name","Agency","Fit","Category","Bid Deadline","Notes"];
    const widths = [16,42,28,12,20,16,42];
    ws.columns = headers.map((h,i)=>({ header:h, width: widths[i] }));
    const headerRow = ws.getRow(1);
    headerRow.eachCell(c=>{
      c.font = { name:"Arial", bold:true, color:{argb:"FFFFFFFF"} };
      c.fill = { type:"pattern", pattern:"solid", fgColor:{argb:"FF1F4E78"} };
      c.alignment = { wrapText:true, vertical:"top" };
    });
    const fitFillArgb = { Strong:"FFC6EFCE", Medium:"FFFFEB9C", "Low-Medium":"FFFFEB9C", Low:"FFFFC7CE", Unknown:"FFD9D9D9" };
    state.external.forEach(r=>{
      const row = ws.addRow([r.rn, r.name, r.agency, r.fit, r.category, r.bidDeadline, r.notes]);
      row.eachCell(c=>{ c.font = { name:"Arial", size:9 }; c.alignment = { wrapText:true, vertical:"top" }; });
      const fitCell = row.getCell(4);
      fitCell.font = { name:"Arial", size:9, bold:true };
      fitCell.fill = { type:"pattern", pattern:"solid", fgColor:{argb: fitFillArgb[r.fit] || "FFD9D9D9"} };
    });
    ws.views = [{ state:"frozen", ySplit:1 }];
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `Midwam_External_Tenders_${dateStr}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Excel exported");
  } catch(e){
    alert("Excel export failed: " + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}

    pptx.layout = "WIDE";
    const headOpts = { bold:true, color:textHex, fill:{color:"2B241C"}, fontSize:9 };
    const bodyOpts = (extra)=>Object.assign({color:textHex, fontSize:9}, extra||{});

    let slide = pptx.addSlide();
    slide.background = { color: bgHex };
    slide.addText(state.titles.brand || "", { x:0.6, y:0.5, w:10, h:0.4, fontSize:12, color:accentHex, bold:true, charSpacing:2 });
    slide.addText(state.titles.h1 || "Saud — Business Tracking Dashboard", { x:0.6, y:2.7, w:12, h:1.1, fontSize:34, bold:true, color:textHex });
    slide.addText(state.titles.subtitle || "", { x:0.6, y:3.7, w:11.5, h:0.7, fontSize:15, color:"A79A82" });
    slide.addText("Last updated: " + state.lastUpdated, { x:0.6, y:6.7, w:6, h:0.4, fontSize:11, color:"A79A82" });
    slide.addText(state.titles.ownerLine || "", { x:0.6, y:7.0, w:6, h:0.35, fontSize:11, color:"A79A82" });

    slide = pptx.addSlide(); slide.background = { color: bgHex };
    slide.addText("OVERVIEW — PORTFOLIO KPIS", { x:0.5, y:0.4, w:10, h:0.5, fontSize:16, bold:true, color:accentHex, charSpacing:2 });
    const submitted = state.internal.filter(r=>r.stage==="Submitted").length;
    const oppValue = state.internal.reduce((s,r)=>s+(+r.value||0),0);
    const tiles = [
      {v:String(submitted), l:"RFP Submitted"}, {v:oppValue.toLocaleString()+" SAR", l:"Opportunity Value"},
      {v:String(state.projects.length), l:"Projects Tracked"}, {v:String(state.prototypes.length), l:"Prototypes Tracked"},
      {v:String(state.tasks.filter(t=>t.status!=="Done").length + state.todos.filter(t=>!t.done).length), l:"Open Tasks"}
    ];
    const statW = 2.3, statGap = 0.2;
    tiles.forEach((s,i)=>{
      const x = 0.5 + i*(statW+statGap);
      slide.addShape("roundRect", { x, y:1.3, w:statW, h:1.6, fill:{color:"2B241C"}, line:{color:"2B241C"}, rectRadius:0.1 });
      slide.addText(s.v, { x, y:1.5, w:statW, h:0.6, fontSize:18, bold:true, color:textHex, align:"center" });
      slide.addText(s.l, { x:x+0.1, y:2.1, w:statW-0.2, h:0.6, fontSize:9, color:"A79A82", align:"center" });
    });

    function tableSlide(title, headers, rows, colW){
      const sl = pptx.addSlide(); sl.background = { color: bgHex };
      sl.addText(title.toUpperCase(), { x:0.5, y:0.35, w:11, h:0.45, fontSize:15, bold:true, color:accentHex, charSpacing:2 });
      const tblRows = [headers.map(h=>({text:h, options:headOpts}))];
      rows.forEach(r=>tblRows.push(r.map(c=>({text:String(c==null?"":c), options:bodyOpts()}))));
      sl.addTable(tblRows, { x:0.4, y:0.9, w:12.5, colW, border:{color:"3A3226", pt:0.5}, autoPage:true, autoPageLineWeight:0.5, newSlideStartY:0.9 });
    }

    tableSlide(state.titles.sectionExternal || "External", ["RN","Competition Name","Agency","Fit","Category","Bid Deadline"],
      state.external.map(r=>[r.rn,r.name,r.agency,r.fit,r.category,r.bidDeadline]), [1.4,4.6,2.5,1.2,2.2,1.6]);

    tableSlide(state.titles.sectionInternal || "Internal Performance", ["Opportunity","Client/Agency","Value (SAR)","Stage","Owner"],
      state.internal.map(r=>[r.name,r.client,(+r.value||0).toLocaleString(),r.stage,r.owner]), [4.7,2.8,2,1.6,1.4]);

    tableSlide(state.titles.sectionProjects || "Projects in Operations", ["Project","Status","Financially","Operationally","Deadline"],
      state.projects.map(r=>[r.name,r.status,r.financially,r.operationally,r.deadline]), [3.4,1.8,2.7,2.9,1.7]);

    tableSlide(state.titles.sectionPrototypes || "Prototypes Tracker", ["Prototype","Status","Team","Notes","Value"],
      state.prototypes.map(r=>[r.name,r.status,r.team,r.notes,r.value]), [3.4,1.8,1.6,4.5,1.2]);

    tableSlide(state.titles.sectionMarketing || "Marketing", ["Initiative / Campaign","Channel","Status","Target Date","Notes"],
      state.marketing.map(r=>[r.initiative,r.channel,r.status,r.targetDate,r.notes]), [3.6,1.8,1.6,1.8,3.7]);

    tableSlide("Recurring Tasks", ["Task","Owner","Status","Cadence","Notes"],
      state.tasks.map(r=>[r.task,r.owner,r.status,r.cadence,r.notes]), [3.4,1.8,1.6,1.6,4.1]);

    tableSlide("Next Steps (Milestones)", ["Milestone","Owner","Target Date","Status","Notes"],
      state.milestones.map(r=>[r.milestone,r.owner,r.targetDate,r.status,r.notes]), [3.6,1.6,1.8,1.6,3.9]);

    tableSlide("To-Do List", ["Done","Item","Owner","Due","Notes"],
      state.todos.map(r=>[r.done?"Yes":"No",r.item,r.owner,r.due,r.notes]), [1,4,1.8,1.6,4.1]);

    slide = pptx.addSlide(); slide.background = { color: bgHex };
    slide.addText("NOTES & LEGEND", { x:0.5, y:0.4, w:10, h:0.5, fontSize:16, bold:true, color:accentHex, charSpacing:2 });
    const raciText = state.raci.map(r=>`${r.section}: ${r.owner}`).join("\n");
    const sourcesText = state.sources.map(s=>"•  "+s).join("\n\n");
    const methodText = state.methodology.map(s=>"•  "+s).join("\n\n");
    slide.addText("OWNERSHIP\n"+raciText+"\n\nDATA SOURCES\n"+sourcesText+"\n\nMETHODOLOGY\n"+methodText,
      { x:0.5, y:1.1, w:12.3, h:5.9, fontSize:11, color:textHex, lineSpacingMultiple:1.25, valign:"top" });

    const fname = (state.titles.h1 || "saud-dashboard").replace(/[^a-z0-9]+/gi,"-").toLowerCase() + ".pptx";
    await pptx.writeFile({ fileName: fname });
  } catch(e){
    alert("PPTX export failed: " + e.message);
  } finally {
    btn.disabled = false; btn.innerHTML = orig;
  }
}

/* ---------- boot ---------- */
(function boot(){
  if(READONLY){
    if(window.__SAUD_DATA__) state = window.__SAUD_DATA__;
    renderAll();
    return;
  }
  const draft = loadLocalDraft();
  if(draft){
    state = draft;
    document.getElementById("draftBanner").classList.add("show");
  }
  renderAll();
})();
if(!READONLY) document.getElementById("syncPanel").classList.add("open"); // public shell: prompt every visitor to connect
</script>

<button id="saud-chat-fab" title="Ask Saud"><span data-bind="titles.chatFabIcon">💬</span></button>

<div id="saud-chat-panel">
  <div id="saud-chat-header">
    <div class="saud-chat-title">
      <span data-bind="titles.chatHeaderIcon">💬</span>
      <div>
        <div data-bind="titles.chatHeaderTitle">Ask Saud</div>
        <div class="saud-chat-sub" data-bind="titles.chatHeaderSub">Grounded in this dashboard's live data</div>
      </div>
    </div>
    <span id="saud-chat-close" title="Close" data-bind="titles.chatCloseIcon">✕</span>
  </div>
  <div id="saud-chat-log">
    <div id="saud-chat-empty" data-bind="titles.chatEmptyMsg">Ask about tenders, pipeline value, projects, prototypes, or tasks — anything on this dashboard.</div>
  </div>
  <div id="saud-chat-inputrow">
    <textarea id="saud-chat-input" rows="1" placeholder="Ask about tenders, pipeline, projects…"></textarea>
    <button id="saud-chat-send" title="Send"><span data-bind="titles.chatSendIcon">➤</span></button>
  </div>
</div>

<script>
(function () {
  const WORKER_URL = "https://orange-queen-ead8.alhindiharith.workers.dev/";

  // the chat widget's own DOM only exists after this point, so re-run the
  // generic titles binder now that these elements are present — otherwise
  // any customized icon/label text loaded from a local draft or GitHub
  // sync during boot() (which ran before this markup was parsed) would
  // never reach these spans.
  if (typeof renderTitles === "function") { try { renderTitles(); } catch (e) {} }

  const fab = document.getElementById('saud-chat-fab');
  const panel = document.getElementById('saud-chat-panel');
  const closeBtn = document.getElementById('saud-chat-close');
  const log = document.getElementById('saud-chat-log');
  const emptyState = document.getElementById('saud-chat-empty');
  const input = document.getElementById('saud-chat-input');
  const sendBtn = document.getElementById('saud-chat-send');
  let history = [];
  let busy = false;

  fab.onclick = () => {
    if (typeof editing !== 'undefined' && editing) return;
    const opening = panel.style.display !== 'flex';
    panel.style.display = opening ? 'flex' : 'none';
    if (opening) input.focus();
  };
  closeBtn.onclick = () => {
    if (typeof editing !== 'undefined' && editing) return;
    panel.style.display = 'none';
  };

  function escapeHtmlChat(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderMarkdown(md) {
    let html = escapeHtmlChat(md);
    html = html.replace(/```([\s\S]*?)```/g, (m, code) => '<pre><code>' + code.trim() + '</code></pre>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/^---$/gm, '<hr>');

    // tables
    const lines = html.split('\n');
    let out = [];
    let i = 0;
    while (i < lines.length) {
      if (lines[i].includes('|') && lines[i + 1] && /^\s*\|?\s*[-:]+[-| :]*\s*$/.test(lines[i + 1])) {
        const headerCells = lines[i].split('|').map(c => c.trim()).filter(Boolean);
        let tbl = '<div class="saud-table-wrap"><table><thead><tr>' +
          headerCells.map(c => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
        i += 2;
        while (i < lines.length && lines[i].includes('|')) {
          const cells = lines[i].split('|').map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''));
          tbl += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
          i++;
        }
        tbl += '</tbody></table></div>';
        out.push(tbl);
      } else {
        out.push(lines[i]);
        i++;
      }
    }
    html = out.join('\n');

    // lists
    html = html.replace(/(^|\n)((?:[-*] .*(?:\n|$))+)/g, (m, pre, block) => {
      const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^[-*]\s+/, '') + '</li>').join('');
      return pre + '<ul>' + items + '</ul>\n';
    });
    html = html.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g, (m, pre, block) => {
      const items = block.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\.\s+/, '') + '</li>').join('');
      return pre + '<ol>' + items + '</ol>\n';
    });

    // paragraphs
    html = html.split(/\n{2,}/).map(chunk => {
      if (/^\s*<(h1|h2|h3|ul|ol|pre|table|div|hr)/.test(chunk.trim())) return chunk;
      const withBr = chunk.trim().replace(/\n/g, '<br>');
      return withBr ? `<p>${withBr}</p>` : '';
    }).join('\n');

    return html;
  }

  function addBubble(role) {
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'saud-msg-row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'saud-bubble';
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function setUserBubble(bubble, text) {
    bubble.textContent = text;
  }

  function setAssistantBubble(bubble, text) {
    bubble.innerHTML = renderMarkdown(text);
    log.scrollTop = log.scrollHeight;
  }

  function showTyping(bubble) {
    bubble.innerHTML = '<div class="saud-typing"><span></span><span></span><span></span></div>';
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  }
  input.addEventListener('input', autoResize);

  function currentContext() {
    const s = (typeof state !== 'undefined' && state) ? state : (window.state || {});
    return {
      external: s.external || [],
      news: s.news || [],
      internal: s.internal || [],
      stageProbs: s.stageProbs || [],
      projects: s.projects || [],
      prototypes: s.prototypes || [],
      tasks: s.tasks || [],
      milestones: s.milestones || [],
      todos: s.todos || [],
    };
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = '';
    autoResize();

    setUserBubble(addBubble('user'), text);
    history.push({ role: 'user', content: text });

    const reply = addBubble('assistant');
    showTyping(reply);

    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history, context: currentContext() }),
      });
      const data = await res.json();
      const replyText = (data && data.content && data.content[0] && data.content[0].text) || data.error || "Sorry, I couldn't get a response.";
      setAssistantBubble(reply, replyText);
      history.push({ role: 'assistant', content: replyText });
    } catch (e) {
      setAssistantBubble(reply, "Error reaching Saud: " + e.message);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
})();
</script>
